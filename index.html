<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Kas RT 07 Bumi Indah Citty</title>

<!-- Chart.js & jsPDF -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#eef2f7;
}
header{
  background:#2f80ed;
  color:white;
  padding:15px;
  text-align:center;
}
.container{
  padding:20px;
  max-width:1000px;
  margin:auto;
}
.card{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
  box-shadow:0 4px 8px rgba(0,0,0,0.1);
}
button{
  background:#2f80ed;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:5px;
  cursor:pointer;
}
.logout{background:red;}
input,select{padding:8px;margin:5px;}
.formInput{display:none;}
.masuk{color:green;font-weight:bold;}
.keluar{color:red;font-weight:bold;}
table{
  width:100%;
  border-collapse:collapse;
  min-width:500px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px;
  text-align:center;
  font-size:13px;
}
th{background:#2f80ed;color:white;}
.table-responsive{overflow-x:auto;-webkit-overflow-scrolling:touch;}
@media screen and (max-width:480px){
  table th, table td{font-size:12px;padding:6px;}
}
</style>
</head>
<body>

<header>
<h2>Laporan Kas RT 07 Bumi Indah Citty</h2>
</header>

<div class="container">

<!-- Pilihan Kas & Filter -->
<div class="card">
<select id="pilihKas" onchange="loadData()">
<option value="Kas_RT">Kas RT</option>
<option value="Kas_Agustusan">Kas Agustusan</option>
</select>

<select id="filterBulan" onchange="loadData()">
<option value="">Semua Bulan</option>
<option value="1">Januari</option>
<option value="2">Februari</option>
<option value="3">Maret</option>
<option value="4">April</option>
<option value="5">Mei</option>
<option value="6">Juni</option>
<option value="7">Juli</option>
<option value="8">Agustus</option>
<option value="9">September</option>
<option value="10">Oktober</option>
<option value="11">November</option>
<option value="12">Desember</option>
</select>

<select id="filterPeriode" onchange="loadData()">
<option value="bulan">Per Bulan</option>
<option value="3bulan">3 Bulan</option>
<option value="tahun">1 Tahun</option>
</select>

<h3 id="saldo">Saldo : Rp 0</h3>

<div style="text-align:right">
<button id="loginBtn">Login Admin</button>
<button id="logoutBtn" class="logout" style="display:none">Logout</button>
<button onclick="cetakPDF()">Cetak PDF</button>
</div>
</div>

<!-- Form Input Transaksi -->
<div class="card formInput" id="formInput">
<h3>Input Transaksi</h3>
<input type="date" id="tanggal">
<input type="text" id="ket" placeholder="Keterangan">
<input type="number" id="masuk" placeholder="Kas Masuk">
<input type="number" id="keluar" placeholder="Kas Keluar">
<button onclick="simpan()">Simpan</button>
</div>

<!-- Tabel Transaksi -->
<div class="card">
<input type="text" id="search" placeholder="Cari transaksi..." onkeyup="cariData()">
<div class="table-responsive">
<table>
<thead>
<tr>
<th>No</th>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Masuk</th>
<th>Keluar</th>
<th>Saldo</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="tabelKas"></tbody>
</table>
</div>
</div>

<!-- Grafik -->
<div class="card">
<h3>Grafik Pemasukan vs Pengeluaran</h3>
<canvas id="chartKas"></canvas>
</div>

</div>

<script>
const API="https://script.google.com/macros/s/AKfycbw6F3TTzWFggrgZTGIrzCTjjUMW4kZdvZPyGp89aigYcob5Xuv6DUUXq8uwllB5PfA/exec";
let admin=false;
let chart;

function rupiah(angka){return "Rp "+Number(angka).toLocaleString("id-ID");}

// Login Admin
document.getElementById("loginBtn").onclick=function(){
  let user=prompt("Username");
  let pass=prompt("Password");
  if(user==="admin" && pass==="12345"){
    admin=true;
    document.getElementById("formInput").style.display="block";
    document.getElementById("loginBtn").style.display="none";
    document.getElementById("logoutBtn").style.display="inline";
  } else alert("Login gagal");
}
document.getElementById("logoutBtn").onclick=function(){
  admin=false;
  document.getElementById("formInput").style.display="none";
  document.getElementById("loginBtn").style.display="inline";
  document.getElementById("logoutBtn").style.display="none";
}

// Load Data
function loadData(){
  let sheet=document.getElementById("pilihKas").value;
  let bulanFilter=document.getElementById("filterBulan").value;
  let periodeFilter=document.getElementById("filterPeriode").value;

  fetch(API+"?sheet="+sheet)
  .then(res=>res.json())
  .then(data=>{
    let html="", saldo=0, totalMasuk=0, totalKeluar=0;

    let now=new Date();
    let bulanNow=now.getMonth()+1;
    let tahunNow=now.getFullYear();
    let minDate=new Date();

    if(periodeFilter=="3bulan") minDate.setMonth(bulanNow-3);
    else if(periodeFilter=="tahun") minDate.setFullYear(tahunNow-1);

    data.forEach(d=>{
      let tgl=new Date(d.tanggal);
      if(bulanFilter && (tgl.getMonth()+1)!=bulanFilter) return;
      if(periodeFilter=="3bulan" && tgl<minDate) return;
      if(periodeFilter=="tahun" && tgl<minDate) return;

      saldo+=Number(d.masuk)-Number(d.keluar);
      totalMasuk+=Number(d.masuk);
      totalKeluar+=Number(d.keluar);
      html+=`<tr>
        <td></td>
        <td>${tgl.toLocaleDateString("id-ID")}</td>
        <td>${d.keterangan}</td>
        <td class="masuk">${rupiah(d.masuk)}</td>
        <td class="keluar">${rupiah(d.keluar)}</td>
        <td>${rupiah(saldo)}</td>
        <td>
          <button onclick="editData('${d.tanggal}','${d.keterangan}','${d.masuk}','${d.keluar}')">Edit</button>
          <button onclick="hapusData('${d.tanggal}')">Hapus</button>
        </td>
      </tr>`;
    });

    document.getElementById("tabelKas").innerHTML=html;

    // Nomor urut
    document.querySelectorAll("#tabelKas tr").forEach((tr,i)=>{tr.cells[0].innerText=i+1});

    document.getElementById("saldo").innerHTML="Saldo : "+rupiah(saldo);
    grafik(totalMasuk,totalKeluar);
  })
}

// Grafik
function grafik(masuk,keluar){
  if(chart) chart.destroy();
  chart=new Chart(document.getElementById("chartKas"),{
    type:"doughnut",
    data:{
      labels:["Pemasukan","Pengeluaran"],
      datasets:[{data:[masuk,keluar]}]
    }
  })
}

// Cari Data
function cariData(){
  let input=document.getElementById("search").value.toLowerCase();
  document.querySelectorAll("#tabelKas tr").forEach(r=>{
    let text=r.innerText.toLowerCase();
    r.style.display=text.includes(input)?"":"none";
  })
}

// Simpan Data
function simpan(){
  if(!admin){alert("Login dulu!"); return;}
  let data={
    sheet:document.getElementById("pilihKas").value,
    tanggal:document.getElementById("tanggal").value,
    keterangan:document.getElementById("ket").value,
    masuk:document.getElementById("masuk").value,
    keluar:document.getElementById("keluar").value
  }
  fetch(API,{method:"POST",body:JSON.stringify(data)})
  .then(res=>res.text()).then(()=>{alert("Data tersimpan"); loadData();})
}

// Edit & Hapus
function editData(tgl,ket,masuk,keluar){
  document.getElementById("tanggal").value=tgl;
  document.getElementById("ket").value=ket;
  document.getElementById("masuk").value=masuk;
  document.getElementById("keluar").value=keluar;
  // Saat klik Simpan akan overwrite sesuai tanggal + keterangan
}

function hapusData(tgl){
  if(!confirm("Hapus data tanggal "+tgl+"?")) return;
  fetch(API,{method:"DELETE",body:JSON.stringify({tanggal:tgl})})
  .then(res=>res.text()).then(()=>{alert("Data dihapus"); loadData();})
}

// PDF
function cetakPDF(){
  const { jsPDF }=window.jspdf;
  let doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  let kas=document.getElementById("pilihKas").selectedOptions[0].text;
  let periode=document.getElementById("filterPeriode").selectedOptions[0].text;
  doc.setFontSize(18);
  doc.text("LAPORAN KAS RT 07",105,15,{align:"center"});
  doc.setFontSize(12);
  doc.text("Perumahan Bumi Indah Citty",105,22,{align:"center"});
  doc.setLineWidth(0.5); doc.line(14,28,196,28);
  doc.setFontSize(11);
  doc.text("Jenis Kas : "+kas,14,35);
  doc.text("Periode : "+periode,14,41);
  doc.text("Tanggal Cetak : "+new Date().toLocaleDateString("id-ID"),14,47);

  let rows=[],totalMasuk=0,totalKeluar=0;
  document.querySelectorAll("#tabelKas tr").forEach((tr)=>{
    let td=tr.querySelectorAll("td"); if(td.length===0) return;
    let m=td[3].innerText.replace(/[^0-9]/g,"");
    let k=td[4].innerText.replace(/[^0-9]/g,"");
    totalMasuk+=Number(m); totalKeluar+=Number(k);
    rows.push([td[0].innerText,td[1].innerText,td[2].innerText,td[3].innerText,td[4].innerText,td[5].innerText]);
  });

  doc.autoTable({startY:55, head:[["No","Tanggal","Keterangan","Masuk","Keluar","Saldo"]],
    body:rows,
    styles:{fontSize:10},
    headStyles:{fillColor:[47,128,237],halign:"center"},
    columnStyles:{3:{halign:"right"},4:{halign:"right"},5:{halign:"right"}},
    margin:{left:14,right:14}
  });

  let y=doc.lastAutoTable.finalY+10;
  let saldo=totalMasuk-totalKeluar;
  doc.text("Total Pemasukan : Rp "+totalMasuk.toLocaleString("id-ID"),14,y);
  doc.text("Total Pengeluaran : Rp "+totalKeluar.toLocaleString("id-ID"),14,y+6);
  doc.text("Saldo Akhir : Rp "+saldo.toLocaleString("id-ID"),14,y+12);

  let ttdY=y+35;
  doc.text("Tangerang, "+new Date().toLocaleDateString("id-ID"),140,ttdY);
  doc.text("Mengetahui,",20,ttdY+10);
  doc.text("Ketua RT 07",20,ttdY+20);
  doc.text("(Muhammad Zainudin)",20,ttdY+40);
  doc.text("Bendahara RT 07",140,ttdY+20);
  doc.text("(Abdul Goni)",140,ttdY+40);

  doc.save("Laporan_Kas_RT07.pdf");
}

// Inisialisasi
loadData();
setInterval(loadData,5000);
</script>

</body>
</html>
