<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard Kas RT</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#eef2f7;
}

header{
background:#2f80ed;
color:white;
padding:15px;
text-align:center;
}

.container{
padding:20px;
max-width:1000px;
margin:auto;
}

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border-bottom:1px solid #ddd;
padding:8px;
text-align:center;
font-size:13px;
}

th{
background:#2f80ed;
color:white;
}

.tableWrap{
overflow-x:auto;
}

.masuk{
color:green;
font-weight:bold;
}

.keluar{
color:red;
font-weight:bold;
}

</style>

</head>

<body>

<header>

<h2>Dashboard Kas RT</h2>

</header>

<div class="container">

<div class="card">

<select id="pilihKas" onchange="loadData()">

<option value="Kas_RT">Kas RT</option>

<option value="Kas_Agustusan">Kas Agustusan</option>

</select>

<h3 id="saldo">Saldo : Rp 0</h3>

</div>

<div class="card">

<h3>Input Transaksi</h3>

<input type="date" id="tanggal">

<input type="text" id="ket" placeholder="Keterangan">

<input type="number" id="masuk" placeholder="Kas Masuk">

<input type="number" id="keluar" placeholder="Kas Keluar">

<button onclick="simpan()">Simpan</button>

</div>

<div class="card">

<input type="text" id="search" placeholder="Cari transaksi..." onkeyup="cari()">

<div class="tableWrap">

<table>

<thead>

<tr>

<th>Tanggal</th>

<th>Keterangan</th>

<th>Masuk</th>

<th>Keluar</th>

<th>Saldo</th>

<th>Aksi</th>

</tr>

</thead>

<tbody id="tabel"></tbody>

</table>

</div>

</div>

<div class="card">

<canvas id="chartKas"></canvas>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbzyX2BajjwgXioevWFTbdYfH3p_g_c97Pvu-QMJkInV6_MydkjUT22LKKVN3j8B_iQ/exec";

let chart;

function rupiah(a){

return "Rp "+Number(a).toLocaleString("id-ID");

}

function loadData(){

let sheet=document.getElementById("pilihKas").value;

fetch(API+"?sheet="+sheet)

.then(r=>r.json())

.then(data=>{

let html="";

let saldo=0;

let masuk=0;

let keluar=0;

data.forEach(d=>{

let m=Number(d.masuk)||0;

let k=Number(d.keluar)||0;

saldo+=m-k;

masuk+=m;

keluar+=k;

html+=`
<tr>
<td>${new Date(d.tanggal).toLocaleDateString("id-ID")}</td>
<td>${d.keterangan}</td>
<td class="masuk">${m?rupiah(m):"-"}</td>
<td class="keluar">${k?rupiah(k):"-"}</td>
<td>${rupiah(saldo)}</td>
<td><button onclick="hapus('${d.rowId}')">Hapus</button></td>
</tr>
`;

});

document.getElementById("tabel").innerHTML=html;

document.getElementById("saldo").innerHTML="Saldo : "+rupiah(saldo);

grafik(masuk,keluar);

})

}

function grafik(m,k){

if(chart) chart.destroy();

chart=new Chart(document.getElementById("chartKas"),{

type:"doughnut",

data:{

labels:["Masuk","Keluar"],

datasets:[{data:[m,k]}]

}

})

}

function simpan(){

let data={

sheet:document.getElementById("pilihKas").value,

action:"add",

tanggal:document.getElementById("tanggal").value,

keterangan:document.getElementById("ket").value,

masuk:document.getElementById("masuk").value||0,

keluar:document.getElementById("keluar").value||0

}

fetch(API,{

method:"POST",

body:JSON.stringify(data)

})

.then(()=>{

loadData();

})

}

function hapus(id){

fetch(API,{

method:"POST",

body:JSON.stringify({

sheet:document.getElementById("pilihKas").value,

action:"delete",

rowId:id

})

})

.then(()=>loadData())

}

loadData();

</script>

</body>

</html>
