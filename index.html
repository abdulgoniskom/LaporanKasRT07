<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Kas RT 07</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
<style>
body{font-family:Arial;margin:0;background:#eef2f7;}
header{background:#2f80ed;color:white;padding:15px;text-align:center;}
.container{padding:20px;max-width:1000px;margin:auto;}
.card{background:white;padding:15px;border-radius:10px;margin-bottom:20px;box-shadow:0 4px 8px rgba(0,0,0,0.1);}
button{background:#2f80ed;color:white;border:none;padding:6px 12px;border-radius:5px;cursor:pointer;margin:2px;}
.logout{background:red;}
table{width:100%;border-collapse:collapse;}
th,td{border-bottom:1px solid #ddd;padding:8px;text-align:center;font-size:13px;}
th{background:#2f80ed;color:white;}
.masuk{color:green;font-weight:bold;}
.keluar{color:red;font-weight:bold;}
input,select{padding:6px;margin:3px;}
.formInput{display:none;}
.tableWrapper{overflow-x:auto;}
</style>
</head>
<body>
<header><h2>Laporan Kas RT 07 Bumi Indah Citty</h2></header>
<div class="container">

<div class="card">
<select id="pilihKas" onchange="loadData()">
<option value="Kas_RT">Kas RT</option>
<option value="Kas_Agustusan">Kas Agustusan</option>
</select>

<select id="filterBulan" onchange="loadData()">
<option value="">Semua Bulan</option>
<option value="1">Januari</option>
<option value="2">Februari</option>
<option value="3">Maret</option>
<option value="4">April</option>
<option value="5">Mei</option>
<option value="6">Juni</option>
<option value="7">Juli</option>
<option value="8">Agustus</option>
<option value="9">September</option>
<option value="10">Oktober</option>
<option value="11">November</option>
<option value="12">Desember</option>
</select>

<select id="filterPeriode" onchange="loadData()">
<option value="bulan">Per Bulan</option>
<option value="3bulan">3 Bulan</option>
<option value="tahun">1 Tahun</option>
</select>

<h3 id="saldo">Saldo : Rp 0</h3>

<div style="text-align:right">
<button id="loginBtn">Login Admin</button>
<button id="logoutBtn" class="logout" style="display:none">Logout</button>
<button onclick="cetakPDF()">Cetak PDF</button>
</div>
</div>

<div class="card formInput" id="formInput">
<h3>Tambah/Edit Transaksi</h3>
<input type="date" id="tanggal">
<input type="text" id="ket" placeholder="Keterangan">
<input type="number" id="masuk" placeholder="Kas Masuk">
<input type="number" id="keluar" placeholder="Kas Keluar">
<input type="file" id="bukti" accept="image/*">
<button onclick="simpan()">Simpan</button>
</div>

<div class="card">
<input type="text" id="search" placeholder="Cari transaksi..." onkeyup="cariData()">
<div class="tableWrapper">
<table>
<thead>
<tr><th>Tanggal</th><th>Keterangan</th><th>Masuk</th><th>Keluar</th><th>Bukti</th><th>Saldo</th><th>Aksi</th></tr>
</thead>
<tbody id="tabelKas"></tbody>
</table>
</div>
</div>

<div class="card">
<h3>Grafik Pemasukan vs Pengeluaran</h3>
<canvas id="chartKas"></canvas>
</div>

</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyaSsfEQNheM2JEy6lQwY9aO1qTBjl6AwsZtvfIRg3KxPGy1K4v61Df8W1DKRb98GE/exec"; // ganti
let admin=false;
let chart;
let editRowId = null;

function rupiah(angka){return angka>0?"Rp "+Number(angka).toLocaleString("id-ID"):"-";}

document.getElementById("loginBtn").onclick=function(){
let user=prompt("Username"); let pass=prompt("Password");
if(user==="admin" && pass==="12345"){
admin=true;
document.getElementById("formInput").style.display="block";
document.getElementById("loginBtn").style.display="none";
document.getElementById("logoutBtn").style.display="inline";
loadData();
}else{alert("Login gagal");}
}

document.getElementById("logoutBtn").onclick=function(){
admin=false;
document.getElementById("formInput").style.display="none";
document.getElementById("loginBtn").style.display="inline";
document.getElementById("logoutBtn").style.display="none";
loadData();
}

function loadData(){
let sheet=document.getElementById("pilihKas").value;
let bulanFilter=document.getElementById("filterBulan").value;
fetch(API+"?sheet="+sheet)
.then(res=>res.json())
.then(data=>{
let html=""; let saldo=0; let totalMasuk=0; let totalKeluar=0;
data.reverse();
data.forEach(d=>{
let tgl = new Date(d.Tanggal).toLocaleDateString("id-ID");
let masuk = Number(d.Masuk);
let keluar = Number(d.Keluar);
saldo += masuk - keluar;
totalMasuk += masuk;
totalKeluar += keluar;
let buktiHtml = d.Bukti?`<a href="${d.Bukti}" target="_blank"><img src="${d.Bukti}" width="50"></a>`:"";
let aksi = admin?`<button onclick="editTransaksi('${d.rowId}')">✏️</button><button onclick="hapusTransaksi('${d.rowId}')">🗑️</button>`:"";
html+=`<tr>
<td>${tgl}</td>
<td>${d.Keterangan}</td>
<td class="masuk">${rupiah(masuk)}</td>
<td class="keluar">${rupiah(keluar)}</td>
<td>${buktiHtml}</td>
<td>${rupiah(saldo)}</td>
<td>${aksi}</td>
</tr>`;
});
document.getElementById("tabelKas").innerHTML=html;
grafik(totalMasuk,totalKeluar);
document.getElementById("saldo").innerText="Saldo : "+rupiah(saldo);
})
}

function grafik(masuk,keluar){
if(chart) chart.destroy();
chart=new Chart(document.getElementById("chartKas"),{
type:"doughnut",
data:{labels:["Pemasukan","Pengeluaran"],datasets:[{data:[masuk,keluar]}]}
})
}

function cariData(){
let input=document.getElementById("search").value.toLowerCase();
document.querySelectorAll("#tabelKas tr").forEach(r=>{
r.style.display = r.innerText.toLowerCase().includes(input)?"":"none";
})
}

function simpan(){
let sheet=document.getElementById("pilihKas").value;
let tanggal=document.getElementById("tanggal").value;
let keterangan=document.getElementById("ket").value;
let masuk=document.getElementById("masuk").value||0;
let keluar=document.getElementById("keluar").value||0;
let buktiInput=document.getElementById("bukti");
if(buktiInput.files.length>0){
let file = buktiInput.files[0];
let reader = new FileReader();
reader.onload = function(e){
let base64Data = e.target.result.split(",")[1];
uploadBukti(sheet, tanggal, keterangan, masuk, keluar, base64Data);
};
reader.readAsDataURL(file);
}else{
postData(sheet, tanggal, keterangan, masuk, keluar, "");
}
}

function uploadBukti(sheet,tanggal,keterangan,masuk,keluar,base64){
fetch("https://script.google.com/macros/s/UPLOAD_ENDPOINT",{
method:"POST",
body:JSON.stringify({sheet,tanggal,keterangan,masuk,keluar,bukti:base64})
}).then(()=>loadData());
}

function postData(sheet,tanggal,keterangan,masuk,keluar,bukti){
fetch(API,{method:"POST",body:JSON.stringify({sheet,tanggal,keterangan,masuk,keluar,bukti})})
.then(()=>loadData());
}

function editTransaksi(rowId){
editRowId=rowId;
alert("Fungsi edit siap, sesuaikan dengan UI input untuk edit. Implementasi Apps Script updateRow diperlukan.");
}

function hapusTransaksi(rowId){
if(confirm("Hapus transaksi ini?")) fetch(API,{method:"POST",body:JSON.stringify({sheet:document.getElementById("pilihKas").value,rowId,delete:true})}).then(()=>loadData());
}

loadData();
setInterval(loadData,5000);
</script>
</body>
</html>
