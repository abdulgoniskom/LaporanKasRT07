<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Kas RT 07 Bumi Indah Citty</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#eef2f7;
}
header{
  background:#2f80ed;
  color:white;
  padding:15px;
  text-align:center;
}
.container{
  padding:20px;
  max-width:1000px;
  margin:auto;
}
.card{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
  box-shadow:0 4px 8px rgba(0,0,0,0.1);
}
button{
  background:#2f80ed;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:5px;
  cursor:pointer;
}
.logout{
  background:red;
}
table{
  width:100%;
  border-collapse:collapse;
  table-layout:auto;
  min-width:600px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px;
  text-align:center;
  font-size:13px;
}
th{
  background:#2f80ed;
  color:white;
}
.masuk{
  color:green;
  font-weight:bold;
}
.keluar{
  color:red;
  font-weight:bold;
}
input,select{
  padding:8px;
  margin:5px;
}
.formInput{
  display:none;
}
</style>
</head>
<body>

<header>
<h2>Laporan Kas RT 07 Bumi Indah Citty</h2>
</header>

<div class="container">

<div class="card">
<select id="pilihKas" onchange="loadData()">
  <option value="Kas_RT">Kas RT</option>
  <option value="Kas_Agustusan">Kas Agustusan</option>
</select>

<select id="filterBulan" onchange="loadData()">
  <option value="">Semua Bulan</option>
  <option value="1">Januari</option>
  <option value="2">Februari</option>
  <option value="3">Maret</option>
  <option value="4">April</option>
  <option value="5">Mei</option>
  <option value="6">Juni</option>
  <option value="7">Juli</option>
  <option value="8">Agustus</option>
  <option value="9">September</option>
  <option value="10">Oktober</option>
  <option value="11">November</option>
  <option value="12">Desember</option>
</select>

<select id="filterPeriode" onchange="loadData()">
  <option value="bulan">Per Bulan</option>
  <option value="3bulan">3 Bulan</option>
  <option value="tahun">1 Tahun</option>
</select>

<h3 id="saldo">Saldo : Rp 0</h3>

<div style="text-align:right">
  <button id="loginBtn">Login Admin</button>
  <button id="logoutBtn" class="logout" style="display:none">Logout</button>
  <button onclick="cetakPDF()">Cetak PDF</button>
</div>
</div>

<div class="card formInput" id="formInput">
<h3>Input Transaksi</h3>
<input type="date" id="tanggal">
<input type="text" id="ket" placeholder="Keterangan">
<input type="number" id="masuk" placeholder="Kas Masuk">
<input type="number" id="keluar" placeholder="Kas Keluar">
<button onclick="simpan()">Simpan</button>
</div>

<div class="card">
<input type="text" id="search" placeholder="Cari transaksi..." onkeyup="cariData()">
<div style="overflow-x:auto;">
<table>
  <thead>
    <tr>
      <th>Tanggal</th>
      <th>Keterangan</th>
      <th>Masuk</th>
      <th>Keluar</th>
      <th>Saldo</th>
    </tr>
  </thead>
  <tbody id="tabelKas"></tbody>
</table>
</div>
</div>

<div class="card">
<h3>Grafik Pemasukan vs Pengeluaran</h3>
<canvas id="chartKas"></canvas>
</div>

</div>

<script>
const API="https://script.google.com/macros/s/AKfycbywANVube6h-uacfNpwWMPd7zk2XM59D0SNq1R4eio3KTJil_ctxpozfJLPBbaSWL4/exec";
let admin=false;
let chart;

function rupiah(angka){
  return angka && angka != 0 ? "Rp "+Number(angka).toLocaleString("id-ID") : "-";
}

document.getElementById("loginBtn").onclick=function(){
  let user=prompt("Username");
  let pass=prompt("Password");
  if(user==="admin" && pass==="12345"){
    admin=true;
    document.getElementById("formInput").style.display="block";
    document.getElementById("loginBtn").style.display="none";
    document.getElementById("logoutBtn").style.display="inline";
  }else{
    alert("Login gagal");
  }
}

document.getElementById("logoutBtn").onclick=function(){
  admin=false;
  document.getElementById("formInput").style.display="none";
  document.getElementById("loginBtn").style.display="inline";
  document.getElementById("logoutBtn").style.display="none";
}

let dataMentah = []; // Variabel global untuk menampung semua data dari server

function loadData() {
  let sheet = document.getElementById("pilihKas").value;
  
  fetch(API + "?sheet=" + sheet)
    .then(res => res.json())
    .then(data => {
      dataMentah = data; // Simpan data asli
      renderTabel(); // Panggil fungsi untuk menampilkan ke layar
    });
}

function renderTabel() {
  let bulanFilter = document.getElementById("filterBulan").value;
  let periodeFilter = document.getElementById("filterPeriode").value;
  let html = "";
  let runningSaldo = 0;
  let totalMasuk = 0;
  let totalKeluar = 0;

  // Tentukan rentang bulan berdasarkan filterPeriode
  let bulanAkhir = parseInt(bulanFilter);
  let bulanAwal = bulanAkhir;

  if (periodeFilter === "3bulan") bulanAwal = Math.max(1, bulanAkhir - 2);
  if (periodeFilter === "tahun") { bulanAwal = 1; bulanAkhir = 12; }
  if (bulanFilter === "") { bulanAwal = 1; bulanAkhir = 12; }

  dataMentah.forEach(d => {
    let tglObj = new Date(d.tanggal);
    let bln = tglObj.getMonth() + 1;
    let m = Number(d.masuk) || 0;
    let k = Number(d.keluar) || 0;

    // Hitung saldo berjalan untuk semua data (agar saldo akhir akurat)
    runningSaldo += (m - k);

    // Filter tampilan berdasarkan periode
    if (bln >= bulanAwal && bln <= bulanAkhir) {
      totalMasuk += m;
      totalKeluar += k;
      html += `
      <tr>
        <td>${tglObj.toLocaleDateString("id-ID")}</td>
        <td style="text-align:left">${d.keterangan}</td>
        <td class="masuk">${rupiah(m)}</td>
        <td class="keluar">${rupiah(k)}</td>
        <td style="font-weight:bold">${rupiah(runningSaldo)}</td>
      </tr>`;
    }
  });

  document.getElementById("tabelKas").innerHTML = html;
  document.getElementById("saldo").innerHTML = "Saldo Akhir Periode: " + rupiah(totalMasuk - totalKeluar);
  grafik(totalMasuk, totalKeluar);
}
function grafik(masuk,keluar){
  if(chart) chart.destroy();
  chart=new Chart(document.getElementById("chartKas"),{
    type:"doughnut",
    data:{
      labels:["Pemasukan","Pengeluaran"],
      datasets:[{data:[masuk,keluar]}]
    }
  });
}

function cariData(){
  let input=document.getElementById("search").value.toLowerCase();
  let rows=document.querySelectorAll("#tabelKas tr");
  rows.forEach(r=>{
    let text=r.innerText.toLowerCase();
    r.style.display=text.includes(input)?"":"none";
  });
}

function simpan(){

let sheet = document.getElementById("pilihKas").value;

let formData = new FormData();

formData.append("action","add");
formData.append("sheet",sheet);
formData.append("tanggal",document.getElementById("tanggal").value);
formData.append("keterangan",document.getElementById("ket").value);
formData.append("masuk",document.getElementById("masuk").value || 0);
formData.append("keluar",document.getElementById("keluar").value || 0);

fetch(API,{
method:"POST",
body:formData
})
.then(res=>res.text())
.then(res=>{
alert("Data berhasil disimpan");
loadData();

document.getElementById("tanggal").value="";
document.getElementById("ket").value="";
document.getElementById("masuk").value="";
document.getElementById("keluar").value="";
})
.catch(err=>{
alert("Gagal menyimpan data");
console.log(err);
});

}
function cetakPDF() {
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();
  
  let kasName = document.getElementById("pilihKas").selectedOptions[0].text;
  let bulanFilter = document.getElementById("filterBulan").value;
  let periodeFilter = document.getElementById("filterPeriode").value;
  let blnText = document.getElementById("filterBulan").selectedOptions[0].text;

  // Logika Rentang Periode
  let bulanAkhir = bulanFilter === "" ? 12 : parseInt(bulanFilter);
  let bulanAwal = bulanAkhir;
  if (periodeFilter === "3bulan") bulanAwal = Math.max(1, bulanAkhir - 2);
  if (periodeFilter === "tahun" || bulanFilter === "") { bulanAwal = 1; bulanAkhir = 12; }

  let rows = [];
  let saldoAwal = 0;
  let runningSaldo = 0;
  let totalM = 0;
  let totalK = 0;

  dataMentah.forEach(d => {
    let bln = new Date(d.tanggal).getMonth() + 1;
    let m = Number(d.masuk) || 0;
    let k = Number(d.keluar) || 0;

    if (bln < bulanAwal) {
      // Masuk ke Saldo Awal (sebelum periode mulai)
      saldoAwal += (m - k);
    } else if (bln >= bulanAwal && bln <= bulanAkhir) {
      // Masuk ke Tabel PDF
      if (rows.length === 0) runningSaldo = saldoAwal + (m - k);
      else runningSaldo += (m - k);

      totalM += m;
      totalK += k;

      rows.push([
        new Date(d.tanggal).toLocaleDateString("id-ID"),
        d.keterangan,
        rupiah(m),
        rupiah(k),
        rupiah(runningSaldo)
      ]);
    }
  });

  // Tambahkan baris Saldo Awal di PDF
  rows.unshift(["-", "SALDO PINDAHAN (Saldo Awal)", "-", "-", rupiah(saldoAwal)]);

  // Judul & Header
  doc.setFontSize(14);
  doc.text("LAPORAN KAS RT 07 BUMI INDAH CITTY", 105, 15, { align: "center" });
  doc.setFontSize(10);
  let infoPeriode = (bulanFilter === "") ? "Semua Periode" : `Periode: ${bulanAwal} s/d ${bulanAkhir}`;
  doc.text(`Jenis Kas: ${kasName} | ${infoPeriode}`, 105, 22, { align: "center" });

  doc.autoTable({
    startY: 30,
    head: [["Tanggal", "Keterangan", "Masuk", "Keluar", "Saldo"]],
    body: rows,
    theme: 'grid',
    headStyles: { fillColor: [47, 128, 237] },
    columnStyles: { 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' } }
  });

  // Ringkasan Bawah
  let finalY = doc.lastAutoTable.finalY + 10;
  doc.setFont(undefined, 'bold');
  doc.text(`RINGKASAN:`, 14, finalY);
  doc.setFont(undefined, 'normal');
  doc.text(`Saldo Awal Periode: ${rupiah(saldoAwal)}`, 14, finalY + 7);
  doc.text(`Total Pemasukan   : ${rupiah(totalM)}`, 14, finalY + 14);
  doc.text(`Total Pengeluaran : ${rupiah(totalK)}`, 14, finalY + 21);
  doc.setFont(undefined, 'bold');
  doc.text(`SALDO AKHIR      : ${rupiah(saldoAwal + totalM - totalK)}`, 14, finalY + 30);

  // Tanda Tangan
  let w = doc.internal.pageSize.getWidth();
  let signY = finalY + 50;
  doc.setFont(undefined, 'normal');
  doc.text("Tangerang, " + new Date().toLocaleDateString("id-ID"), w - 20, signY, { align: "right" });
  doc.text("Ketua RT 07", 30, signY + 10);
  doc.text("Muhammad Zainudin", 30, signY + 35);
  doc.text("Bendahara RT 07", w - 30, signY + 10, { align: "right" });
  doc.text("Abdul Goni", w - 30, signY + 35, { align: "right" });

  window.open(doc.output('bloburl'), '_blank');
}
loadData();
setInterval(loadData,5000);
</script>

</body>
</html>
