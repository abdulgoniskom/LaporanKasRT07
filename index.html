<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Kas RT 07</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#eef2f7;
}

header{
background:#2f80ed;
color:white;
padding:15px;
text-align:center;
}

.container{
padding:15px;
max-width:1000px;
margin:auto;
}

.card{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

button{
background:#2f80ed;
color:white;
border:none;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
}

button.hapus{
background:#e74c3c;
}

button.edit{
background:#f39c12;
}

table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

th{
background:#2f80ed;
color:white;
padding:8px;
}

td{
padding:8px;
border-bottom:1px solid #ddd;
text-align:center;
}

.masuk{
color:green;
font-weight:bold;
}

.keluar{
color:red;
font-weight:bold;
}

.bottomMenu{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
border-top:1px solid #ddd;
padding:8px;
}

.bottomMenu button{
background:none;
color:#2f80ed;
font-weight:bold;
}

</style>
</head>

<body>

<header>
<h2>Kas RT 07 Bumi Indah Citty</h2>
</header>

<div class="container">

<div class="card">

<select id="pilihKas">
<option value="Kas_RT">Kas RT</option>
<option value="Kas_Agustusan">Kas Agustusan</option>
</select>

<select id="filter">
<option value="bulan">Per Bulan</option>
<option value="3bulan">3 Bulan</option>
<option value="tahun">Tahunan</option>
</select>

<button onclick="loadData()">Refresh</button>

<h3 id="saldo">Saldo : Rp 0</h3>

</div>


<div class="card">

<input type="text" id="search" placeholder="Cari transaksi..." onkeyup="cariData()">

<table>

<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Masuk</th>
<th>Keluar</th>
<th>Saldo</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="tabelKas"></tbody>

</table>

</div>


<div class="card">

<h3>Grafik Kas</h3>
<canvas id="chartKas"></canvas>

</div>

</div>

<div class="bottomMenu">

<button onclick="login()">Login</button>
<button onclick="tambah()">Tambah</button>
<button onclick="cetakPDF()">PDF</button>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbyKyC3XPIVz60KF1wO7xeFWwKcAN6wgJRN-BL81rQBRZsRnK8lmzRl--UY3e5Z0OfQ/exec";

let chart;
let dataKas=[];

function rupiah(n){
return "Rp "+Number(n).toLocaleString("id-ID");
}

function loadData(){

let sheet=document.getElementById("pilihKas").value;

fetch(API+"?sheet="+sheet)

.then(r=>r.json())

.then(data=>{

dataKas=data;

let html="";
let saldo=0;

let totalMasuk=0;
let totalKeluar=0;

data.forEach((d,i)=>{

saldo+=Number(d.masuk)-Number(d.keluar);

totalMasuk+=Number(d.masuk);
totalKeluar+=Number(d.keluar);

html+=`
<tr>
<td>${new Date(d.tanggal).toLocaleDateString("id-ID")}</td>
<td>${d.keterangan}</td>
<td class="masuk">${rupiah(d.masuk)}</td>
<td class="keluar">${rupiah(d.keluar)}</td>
<td>${rupiah(saldo)}</td>
<td>
<button class="edit" onclick="edit(${i})">Edit</button>
<button class="hapus" onclick="hapus(${i})">Hapus</button>
</td>
</tr>
`;

});

document.getElementById("tabelKas").innerHTML=html;

document.getElementById("saldo").innerHTML="Saldo : "+rupiah(saldo);

grafik(totalMasuk,totalKeluar);

})

}

function grafik(masuk,keluar){

if(chart) chart.destroy();

chart=new Chart(document.getElementById("chartKas"),{

type:"bar",

data:{

labels:["Pemasukan","Pengeluaran"],

datasets:[{

data:[masuk,keluar]

}]

}

})

}

function cariData(){

let input=document.getElementById("search").value.toLowerCase();

document.querySelectorAll("#tabelKas tr").forEach(tr=>{

tr.style.display=tr.innerText.toLowerCase().includes(input)?"":"none";

});

}

function cetakPDF(){

const { jsPDF } = window.jspdf;

let doc=new jsPDF();

doc.text("Laporan Kas RT 07",105,20,{align:"center"});

let rows=[];

document.querySelectorAll("#tabelKas tr").forEach(tr=>{

let td=tr.querySelectorAll("td");

rows.push([
td[0].innerText,
td[1].innerText,
td[2].innerText,
td[3].innerText,
td[4].innerText
]);

});

doc.autoTable({

startY:30,

head:[["Tanggal","Keterangan","Masuk","Keluar","Saldo"]],

body:rows

});

let y=doc.lastAutoTable.finalY+30;

doc.text("Ketua RT 07",20,y);
doc.text("(Nama Pak RT)",20,y+20);

doc.text("Bendahara",140,y);
doc.text("(Nama Bendahara)",140,y+20);

doc.save("LaporanKasRT07.pdf");

}

function login(){

let user=prompt("Username");
let pass=prompt("Password");

if(user=="admin" && pass=="12345"){
alert("Login berhasil");
}else{
alert("Login gagal");
}

}

loadData();

</script>

</body>
</html>
