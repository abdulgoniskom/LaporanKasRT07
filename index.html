<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Kas RT 07 Bumi Indah Citty</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

<style>
body{font-family:Arial;margin:0;background:#eef2f7;}
header{background:#2f80ed;color:white;padding:15px;text-align:center;}
.container{padding:20px;max-width:1000px;margin:auto;}
.card{background:white;padding:15px;border-radius:10px;margin-bottom:20px;box-shadow:0 4px 8px rgba(0,0,0,0.1);}
button{background:#2f80ed;color:white;border:none;padding:6px 10px;border-radius:5px;cursor:pointer;font-size:13px;}
.logout{background:red;}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
th,td{border-bottom:1px solid #ddd;padding:6px;text-align:center;word-wrap:break-word;font-size:13px;}
th{background:#2f80ed;color:white;}
.masuk{color:green;font-weight:bold;}
.keluar{color:red;font-weight:bold;}
input,select{padding:6px;margin:4px;font-size:13px;}
.formInput{display:none;}
@media(max-width:600px){
  table, thead, tbody, th, td, tr{display:block;}
  thead tr{display:none;}
  tr{margin-bottom:10px;border:1px solid #ccc;padding:5px;}
  td{text-align:right;padding-left:50%;position:relative;}
  td::before{position:absolute;left:10px;width:45%;white-space:nowrap;text-align:left;font-weight:bold;}
  td:nth-of-type(1)::before{content:"Tanggal";}
  td:nth-of-type(2)::before{content:"Keterangan";}
  td:nth-of-type(3)::before{content:"Masuk";}
  td:nth-of-type(4)::before{content:"Keluar";}
  td:nth-of-type(5)::before{content:"Saldo";}
  td:nth-of-type(6)::before{content:"Aksi";}
}
</style>
</head>
<body>

<header>
<h2>Laporan Kas RT 07 Bumi Indah Citty</h2>
</header>

<div class="container">

<div class="card">
<select id="pilihKas" onchange="loadData()">
<option value="Kas_RT">Kas RT</option>
<option value="Kas_Agustusan">Kas Agustusan</option>
</select>

<select id="filterBulan" onchange="loadData()">
<option value="">Semua Bulan</option>
<option value="1">Januari</option>
<option value="2">Februari</option>
<option value="3">Maret</option>
<option value="4">April</option>
<option value="5">Mei</option>
<option value="6">Juni</option>
<option value="7">Juli</option>
<option value="8">Agustus</option>
<option value="9">September</option>
<option value="10">Oktober</option>
<option value="11">November</option>
<option value="12">Desember</option>
</select>

<select id="filterPeriode" onchange="loadData()">
<option value="bulan">Per Bulan</option>
<option value="3bulan">3 Bulan</option>
<option value="tahun">1 Tahun</option>
</select>

<h3 id="saldo">Saldo : Rp 0</h3>

<div style="text-align:right">
<button id="loginBtn">Login Admin</button>
<button id="logoutBtn" class="logout" style="display:none">Logout</button>
<button onclick="cetakPDF()">Cetak PDF</button>
</div>
</div>

<div class="card formInput" id="formInput">
<h3>Input Transaksi</h3>
<input type="date" id="tanggal">
<input type="text" id="ket" placeholder="Keterangan">
<input type="number" id="masuk" placeholder="Kas Masuk">
<input type="number" id="keluar" placeholder="Kas Keluar">
<button onclick="simpan()">Simpan</button>
</div>

<div class="card">
<input type="text" id="search" placeholder="Cari transaksi..." onkeyup="cariData()">
<table>
<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Masuk</th>
<th>Keluar</th>
<th>Saldo</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="tabelKas"></tbody>
</table>
</div>

<div class="card">
<h3>Grafik Pemasukan vs Pengeluaran</h3>
<canvas id="chartKas"></canvas>
</div>

</div>

<script>
const API="https://script.google.com/macros/s/AKfycbw6F3TTzWFggrgZTGIrzCTjjUMW4kZdvZPyGp89aigYcob5Xuv6DUUXq8uwllB5PfA/exec";
let admin=false;
let chart;

function rupiah(angka){return "Rp "+Number(angka).toLocaleString("id-ID");}

// Login Admin
document.getElementById("loginBtn").onclick=function(){
let user=prompt("Username"); let pass=prompt("Password");
if(user==="admin" && pass==="12345"){
  admin=true;
  document.getElementById("formInput").style.display="block";
  document.getElementById("loginBtn").style.display="none";
  document.getElementById("logoutBtn").style.display="inline";
  loadData();
}else{alert("Login gagal");}
}
document.getElementById("logoutBtn").onclick=function(){
  admin=false;
  document.getElementById("formInput").style.display="none";
  document.getElementById("loginBtn").style.display="inline";
  document.getElementById("logoutBtn").style.display="none";
  loadData();
}

// Load Data
function loadData(){
let sheet=document.getElementById("pilihKas").value;
let bulanFilter=document.getElementById("filterBulan").value;
fetch(API+"?sheet="+sheet)
.then(res=>res.json())
.then(data=>{
let html="",saldo=0,totalMasuk=0,totalKeluar=0;
data.reverse();
data.forEach(d=>{
let tgl=new Date(d.tanggal).toLocaleDateString("id-ID");
saldo+=Number(d.masuk)-Number(d.keluar);
totalMasuk+=Number(d.masuk); totalKeluar+=Number(d.keluar);
html+=`<tr>
<td>${tgl}</td>
<td>${d.keterangan}</td>
<td class="masuk">${rupiah(d.masuk)}</td>
<td class="keluar">${rupiah(d.keluar)}</td>
<td>${rupiah(saldo)}</td>
<td>${admin?`<button onclick="editData('${d.tanggal}','${d.keterangan}','${d.masuk}','${d.keluar}')">Edit</button> <button onclick="hapusData('${d.tanggal}')">Hapus</button>`:""}</td>
</tr>`;
});
document.getElementById("tabelKas").innerHTML=html;
document.getElementById("saldo").innerHTML="Saldo : "+rupiah(saldo);
grafik(totalMasuk,totalKeluar);
});

// Grafik
function grafik(masuk,keluar){
if(chart) chart.destroy();
chart=new Chart(document.getElementById("chartKas"),{
type:"doughnut",
data:{labels:["Pemasukan","Pengeluaran"],datasets:[{data:[masuk,keluar]}]}
});
}

// Cari
function cariData(){
let input=document.getElementById("search").value.toLowerCase();
document.querySelectorAll("#tabelKas tr").forEach(r=>{r.style.display=r.innerText.toLowerCase().includes(input)?"":"none";});
}

// Simpan
function simpan(){
if(!admin){alert("Login dulu!"); return;}
let sheet=document.getElementById("pilihKas").value;
let data={sheet:sheet,tanggal:document.getElementById("tanggal").value,keterangan:document.getElementById("ket").value,masuk:document.getElementById("masuk").value,keluar:document.getElementById("keluar").value};
fetch(API,{method:"POST",body:JSON.stringify(data)})
.then(res=>res.text()).then(()=>{alert("Data tersimpan");loadData();});
}

// Edit
function editData(tgl,ket,masuk,keluar){
if(!admin){alert("Login dulu!"); return;}
document.getElementById("tanggal").value=tgl;
document.getElementById("ket").value=ket;
document.getElementById("masuk").value=masuk;
document.getElementById("keluar").value=keluar;
}

// Hapus
function hapusData(tgl){
if(!admin){alert("Login dulu!"); return;}
if(confirm("Hapus transaksi tanggal "+tgl+"?")){
  fetch(API+"?hapus="+tgl).then(res=>res.text()).then(()=>{alert("Data terhapus"); loadData();});
}

// Cetak PDF
function cetakPDF(){
const { jsPDF } = window.jspdf;
let doc = new jsPDF();
let kas = document.getElementById("pilihKas").selectedOptions[0].text;
let bulan = document.getElementById("filterBulan").selectedOptions[0].text;

let totalMasuk=0,totalKeluar=0,rows=[];
document.querySelectorAll("#tabelKas tr").forEach(tr=>{
let td=tr.querySelectorAll("td");
if(td.length==0) return;
let masuk = td[2].innerText.replace(/[^0-9]/g,"");
let keluar = td[3].innerText.replace(/[^0-9]/g,"");
totalMasuk += Number(masuk); totalKeluar += Number(keluar);
rows.push([td[0].innerText,td[1].innerText,td[2].innerText,td[3].innerText,td[4].innerText]);
});

doc.setFontSize(18);
doc.text("LAPORAN KAS RT 07",105,20,{align:"center"});
doc.setFontSize(11);
doc.text("Perumahan Bumi Indah Citty",105,27,{align:"center"});
doc.text("Jenis Kas : "+kas,14,40);
doc.text("Periode : "+bulan,14,46);
doc.text("Tanggal Cetak : "+new Date().toLocaleDateString("id-ID"),14,52);

doc.autoTable({startY:60,head:[["Tanggal","Keterangan","Masuk","Keluar","Saldo"]],body:rows,styles:{fontSize:9},headStyles:{fillColor:[47,128,237]},columnStyles:{2:{halign:"right"},3:{halign:"right"},4:{halign:"right"}}});

let y = doc.lastAutoTable.finalY + 10;
doc.setFontSize(11);
doc.text("Total Pemasukan : Rp "+totalMasuk.toLocaleString("id-ID"),14,y);
doc.text("Total Pengeluaran : Rp "+totalKeluar.toLocaleString("id-ID"),14,y+6);
let saldo = totalMasuk-totalKeluar;
doc.text("Saldo Akhir : Rp "+saldo.toLocaleString("id-ID"),14,y+12);

let ttdY = y + 30;
doc.text("Tangerang, "+new Date().toLocaleDateString("id-ID"),140,ttdY);
doc.text("Mengetahui,",20,ttdY+10);
doc.text("Ketua RT 07",20,ttdY+20);
doc.text("(Muhammad Zainudin)",20,ttdY+40);
doc.text("Bendahara RT 07",140,ttdY+20);
doc.text("(Abdul Goni)",140,ttdY+40);

doc.save("Laporan_Kas_RT07.pdf");
}

loadData();
setInterval(loadData,5000);
</script>

</body>
</html>
