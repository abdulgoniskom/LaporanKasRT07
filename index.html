<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kas RT 07 - Laporan Akurat</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

<style>
  body{ font-family: 'Segoe UI', Arial, sans-serif; margin:0; background:#f0f2f5; color: #333; }
  header{ background: #2f80ed; color:white; padding:15px; text-align:center; }
  .container{ padding:15px; max-width:1000px; margin:auto; }
  .card{ background:white; padding:15px; border-radius:10px; margin-bottom:15px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
  .flex-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button{ border:none; padding:10px 15px; border-radius:5px; cursor:pointer; font-weight:bold; color:white; }
  .btn-pdf { background: #8e44ad; }
  .btn-save { background: #27ae60; width: 100%; margin-top: 10px; }
  table{ width:100%; border-collapse:collapse; font-size: 13px; margin-top:10px; }
  th,td{ border-bottom:1px solid #ddd; padding:10px 5px; text-align:center; }
  th{ background:#f8f9fa; }
  .formInput { display:none; border-top: 4px solid #27ae60; }
  label { font-size: 12px; font-weight: bold; margin-top: 8px; display: block; }
  select, input { padding:8px; border:1px solid #ccc; border-radius:5px; width:100%; box-sizing:border-box; }
</style>
</head>
<body>

<header><h3>DASHBOARD KAS RT 07</h3></header>

<div class="container">
  <div class="admin-header" style="text-align:right; margin-bottom:10px;">
    <button id="loginBtn" style="background:#27ae60">LOGIN ADMIN</button>
    <button id="logoutBtn" style="background:#e74c3c; display:none">LOGOUT</button>
  </div>

  <div class="card">
    <div class="flex-group">
      <div style="flex:1">
        <label>BULAN LAPORAN:</label>
        <select id="filterBulan" onchange="renderTabel()">
          <option value="1">Januari</option><option value="2">Februari</option><option value="3">Maret</option>
          <option value="4">April</option><option value="5">Mei</option><option value="6">Juni</option>
          <option value="7">Juli</option><option value="8">Agustus</option><option value="9">September</option>
          <option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option>
        </select>
      </div>
      <div style="flex:1">
        <label>TAHUN:</label>
        <select id="filterTahun" onchange="renderTabel()">
          <option value="2024">2024</option><option value="2025">2025</option><option value="2026" selected>2026</option>
        </select>
      </div>
      <button class="btn-pdf" onclick="cetakPDF()" style="align-self: flex-end;">📄 CETAK</button>
    </div>
    <h2 id="saldoDisplay" style="color:#2f80ed;">Saldo: Rp 0</h2>
  </div>

  <div class="card formInput" id="formInput">
    <h4>TAMBAH/EDIT DATA</h4>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
      <div><label>Tgl Transaksi:</label><input type="date" id="tanggal"></div>
      <div><label>Bulan Laporan:</label><select id="inBulan"><option value="1">Januari</option><option value="2">Februari</option><option value="3">Maret</option><option value="4">April</option><option value="5">Mei</option><option value="6">Juni</option><option value="7">Juli</option><option value="8">Agustus</option><option value="9">September</option><option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option></select></div>
      <div><label>Tahun Laporan:</label><select id="inTahun"><option value="2024">2024</option><option value="2025">2025</option><option value="2026" selected>2026</option></select></div>
    </div>
    <label>Keterangan:</label><input type="text" id="ket">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top:10px;">
      <input type="number" id="masuk" placeholder="Masuk (Rp)">
      <input type="number" id="keluar" placeholder="Keluar (Rp)">
    </div>
    <button id="btnSimpan" class="btn-save" onclick="simpan()">SIMPAN DATA</button>
  </div>

  <div class="card" style="overflow-x:auto;">
    <table>
      <thead><tr id="tableHead"><th>Tanggal</th><th>Keterangan</th><th>Masuk</th><th>Keluar</th><th>Saldo</th></tr></thead>
      <tbody id="tabelKas"></tbody>
    </table>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwJZxkgI_5Lgj7VOrzbc9-bwYBWvfimJDqPXAA5BX2XTC-M3RL8wyYwFybEXOhDK3w/exec"; // Ganti dengan URL Deploy Anda
let dataMentah = [];
let adminMode = false;

function rupiah(n) { return n ? "Rp " + Number(n).toLocaleString("id-ID") : "-"; }

document.getElementById("loginBtn").onclick = () => {
  if(prompt("Password:") === "12345") {
    adminMode = true;
    document.getElementById("formInput").style.display="block";
    document.getElementById("loginBtn").style.display="none";
    document.getElementById("logoutBtn").style.display="inline";
    renderTabel();
  }
};

document.getElementById("logoutBtn").onclick = () => location.reload();

function loadData() {
  fetch(API + "?sheet=Kas_RT").then(r => r.json()).then(d => { dataMentah = d; renderTabel(); });
}

function renderTabel() {
  let filterBln = document.getElementById("filterBulan").value;
  let filterThn = document.getElementById("filterTahun").value;
  
  let html = ""; 
  let runningSaldo = 0; 

  // Reset Header
  document.getElementById("tableHead").innerHTML = `
    <th>Tanggal</th><th>Keterangan</th><th>Masuk</th><th>Keluar</th><th>Saldo</th>
    ${adminMode ? '<th>Aksi</th>' : ''}`;

  dataMentah.forEach((d, index) => {
    let m = Number(d.masuk) || 0;
    let k = Number(d.keluar) || 0;
    
    // Pastikan kita membandingkan sebagai STRING agar tidak error tipe data
    let blnData = String(d.bulan_laporan).trim();
    let thnData = String(d.tahun_laporan).trim();
    let blnFilter = String(filterBln).trim();
    let thnFilter = String(filterThn).trim();

    // Saldo tetap dihitung kumulatif dari semua data di atasnya
    runningSaldo += (m - k);

    // FILTER: Hanya tampilkan jika Bulan & Tahun Laporan sesuai filter
    // Data Januari (11/1/2026) HANYA muncul jika kolom Bulan_Laporan-nya diisi 12
    if (blnData === blnFilter && thnData === thnFilter) {
      html += `<tr>
        <td>${new Date(d.tanggal).toLocaleDateString("id-ID")}</td>
        <td style="text-align:left">${d.keterangan}</td>
        <td class="masuk">${rupiah(m)}</td>
        <td class="keluar">${rupiah(k)}</td>
        <td style="font-weight:bold">${rupiah(runningSaldo)}</td>
        ${adminMode ? `<td>
            <button class="btn-edit" onclick="editData(${index})">Edit</button>
            <button class="btn-hapus" onclick="hapusData(${index})">Del</button>
        </td>` : ""}
      </tr>`;
    }
  });

  if (html === "") {
    html = `<tr><td colspan="6">Tidak ada data untuk laporan bulan ini.</td></tr>`;
  }

  document.getElementById("tabelKas").innerHTML = html;
  document.getElementById("saldoDisplay").innerText = "Saldo Kas: " + rupiah(runningSaldo);
}
function simpan() {
  let fd = new FormData();
  fd.append("action", "add");
  fd.append("sheet", "Kas_RT");
  fd.append("tanggal", document.getElementById("tanggal").value);
  fd.append("keterangan", document.getElementById("ket").value);
  fd.append("masuk", document.getElementById("masuk").value || 0);
  fd.append("keluar", document.getElementById("keluar").value || 0);
  fd.append("bulan_laporan", document.getElementById("inBulan").value);
  fd.append("tahun_laporan", document.getElementById("inTahun").value);
  fetch(API, { method: "POST", body: fd }).then(() => loadData());
}

function hapusData(i) {
  if(confirm("Hapus?")) {
    let fd = new FormData();
    fd.append("action", "delete");
    fd.append("sheet", "Kas_RT");
    fd.append("row", i);
    fetch(API, { method: "POST", body: fd }).then(() => loadData());
  }
}

function cetakPDF() {
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();
  let fB = parseInt(document.getElementById("filterBulan").value);
  let fT = parseInt(document.getElementById("filterTahun").value);
  
  let rows = []; 
  let saldoPindahan = 0; 
  let currentRunning = 0;

  dataMentah.forEach(d => {
    let m = Number(d.masuk) || 0;
    let k = Number(d.keluar) || 0;
    let bData = parseInt(d.bulan_laporan);
    let tData = parseInt(d.tahun_laporan);

    // LOGIKA SALDO PINDAHAN (Uang sebelum bulan laporan dimulai)
    if (tData < fT || (tData === fT && bData < fB)) {
      saldoPindahan += (m - k);
    } 
    // LOGIKA DATA BULAN INI (Hanya yang dipilih)
    else if (tData === fT && bData === fB) {
      if (rows.length === 0) currentRunning = saldoPindahan + (m - k);
      else currentRunning += (m - k);
      
      rows.push([
        new Date(d.tanggal).toLocaleDateString("id-ID"),
        d.keterangan,
        rupiah(m),
        rupiah(k),
        rupiah(currentRunning)
      ]);
    }
  });

  // Tambahkan Baris Saldo Pindahan di Paling Atas
  rows.unshift(["-", "SALDO PINDAHAN BULAN LALU", "-", "-", rupiah(saldoPindahan)]);

  doc.text("LAPORAN KAS RT 07", 105, 15, { align: "center" });
  doc.autoTable({
    startY: 25,
    head: [["Tanggal", "Keterangan", "Masuk", "Keluar", "Saldo"]],
    body: rows,
    theme: 'grid'
  });

  window.open(doc.output('bloburl'), '_blank');
}
loadData();
</script>
</body>
</html>
