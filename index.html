<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi RT 07</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f6; }
        header { background: #1877f2; color: white; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .flex-row { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
        .flex-row > div { flex: 1; min-width: 150px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; color: #555; font-weight: bold; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-blue { background: #1877f2; color: white; }
        .btn-green { background: #2ecc71; color: white; width: 100%; margin-top: 10px; }
        .btn-login { background: #27ae60; color: white; float: right; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th { background: #f8f9fa; padding: 12px; border: 1px solid #ddd; }
        td { padding: 10px; border: 1px solid #ddd; text-align: center; }
        .masuk { color: #27ae60; font-weight: bold; }
        .keluar { color: #e74c3c; font-weight: bold; }
        #adminPanel { display: none; border-top: 5px solid #27ae60; }
        @media (max-width: 600px) { .flex-row > div { min-width: 100%; } }
    </style>
</head>
<body>

<header>DASHBOARD KAS RT 07</header>

<div class="container">
    <button id="loginBtn" class="btn-login" onclick="aksesAdmin()">LOGIN ADMIN</button>
    <div style="clear: both;"></div>

    <div class="card">
        <div class="flex-row">
            <div>
                <label>LIHAT LAPORAN BULAN:</label>
                <select id="selBulan" onchange="renderTabel()">
                    <option value="1">Januari</option><option value="2">Februari</option>
                    <option value="11">November</option><option value="12" selected>Desember</option>
                </select>
            </div>
            <div>
                <label>TAHUN:</label>
                <select id="selTahun" onchange="renderTabel()">
                    <option value="2025" selected>2025</option><option value="2026">2026</option>
                </select>
            </div>
            <button class="btn-blue" onclick="cetakLaporan()">📄 CETAK PDF</button>
        </div>
        <h2 id="totalSaldo" style="color:#1877f2; margin-top:20px;">Saldo Kas: Rp 0</h2>
    </div>

    <div id="adminPanel" class="card">
        <h3>INPUT DATA BARU</h3>
        <div class="flex-row">
            <div><label>Tanggal Transaksi:</label><input type="date" id="inTgl"></div>
            <div><label>Keterangan:</label><input type="text" id="inKet" placeholder="Contoh: Kas Bapak-bapak..."></div>
        </div>
        <div class="flex-row" style="margin-top:15px;">
            <div><label>Masuk (Rp):</label><input type="number" id="inM"></div>
            <div><label>Keluar (Rp):</label><input type="number" id="inK"></div>
            <button class="btn-green" onclick="simpanData()">SIMPAN TRANSAKSI</button>
        </div>
    </div>

    <div class="card" style="overflow-x:auto;">
        <table>
            <thead>
                <tr><th>Tanggal</th><th>Keterangan</th><th>Masuk</th><th>Keluar</th><th>Saldo</th><th class="adm">Aksi</th></tr>
            </thead>
            <tbody id="tabelBody"></tbody>
        </table>
    </div>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbxohG_ln61PWngjv0qBRrAz4eIa5hajO4HAu7AiIg7aqun-AQ9aWFNUSUAvKfd3OuY/exec"; // GANTI DENGAN URL DEPLOYMENT ANDA
    let db = [];
    let isAdm = false;

    function rupiah(n) { return "Rp " + Number(n).toLocaleString("id-ID"); }
    
    function kAngka(v) { 
        if(!v) return 0;
        return parseInt(String(v).replace(/[^0-9-]/g, '')) || 0; 
    }

    function load() {
        fetch(API + "?sheet=Kas_RT").then(res => res.json()).then(data => {
            db = data.map(d => ({
                ...d,
                masuk: kAngka(d.masuk),
                keluar: kAngka(d.keluar),
                // Logika: Jika input Jan 2026, simpan label "Desember 2025"
                blnRef: new Date(d.tanggal).getMonth() === 0 ? 12 : new Date(d.tanggal).getMonth(),
                thnRef: new Date(d.tanggal).getMonth() === 0 ? new Date(d.tanggal).getFullYear() - 1 : new Date(d.tanggal).getFullYear()
            }));
            renderTabel();
        });
    }

    function renderTabel() {
        let fB = document.getElementById("selBulan").value;
        let fT = document.getElementById("selTahun").value;
        let html = ""; let saldoJalan = 0;

        db.forEach((d, i) => {
            saldoJalan += (d.masuk - d.keluar);

            // Filter data Januari agar masuk ke Laporan Desember
            if (String(d.blnRef) === fB && String(d.thnRef) === fT) {
                html += `<tr>
                    <td>${new Date(d.tanggal).toLocaleDateString("id-ID")}</td>
                    <td style="text-align:left">${d.keterangan}</td>
                    <td class="masuk">${rupiah(d.masuk)}</td>
                    <td class="keluar">${rupiah(d.keluar)}</td>
                    <td style="font-weight:bold">${rupiah(saldoJalan)}</td>
                    <td class="adm"><button onclick="hapus(${i})" style="background:red;color:white">X</button></td>
                </tr>`;
            }
        });
        document.getElementById("tabelBody").innerHTML = html || "<tr><td colspan='6'>Data Kosong</td></tr>";
        document.getElementById("totalSaldo").innerText = "Saldo Akhir: " + rupiah(saldoJalan);
        document.querySelectorAll(".adm").forEach(el => el.style.display = isAdm ? "table-cell" : "none");
    }

    function simpanData() {
        let fd = new FormData();
        fd.append("action", "add");
        fd.append("tanggal", document.getElementById("inTgl").value);
        fd.append("keterangan", document.getElementById("inKet").value);
        fd.append("masuk", document.getElementById("inM").value || 0);
        fd.append("keluar", document.getElementById("inK").value || 0);
        
        fetch(API, { method: "POST", body: fd }).then(() => { alert("Tersimpan!"); load(); });
    }

    function aksesAdmin() {
        if(prompt("Sandi:") === "123") {
            isAdm = true;
            document.getElementById("adminPanel").style.display = "block";
            document.getElementById("loginBtn").style.display = "none";
            renderTabel();
        }
    }

    function cetakLaporan() {
        const { jsPDF } = window.jspdf;
        let doc = new jsPDF();
        doc.text("LAPORAN KAS RT 07", 10, 10);
        doc.autoTable({ html: 'table' });
        window.open(doc.output('bloburl'));
    }

    load();
</script>
</body>
</html>
