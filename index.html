<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Kas RT</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
}

h2{
text-align:center;
}

button{
padding:10px 16px;
border:none;
background:#2f80ed;
color:white;
border-radius:5px;
cursor:pointer;
}

.logout{
background:red;
}

.formInput{
display:none;
margin-top:20px;
}

input{
padding:8px;
margin:5px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h2>Laporan Kas RT</h2>

<h3 id="saldo"></h3>

<div style="text-align:right">

<button id="loginBtn">LOGIN ADMIN</button>

<button id="logoutBtn" class="logout" style="display:none">LOGOUT</button>

</div>

<div id="formInput" class="formInput">

<h3>Input Transaksi</h3>

<input type="date" id="tanggal">

<input type="text" id="ket" placeholder="Keterangan">

<input type="number" id="masuk" placeholder="Kas Masuk">

<input type="number" id="keluar" placeholder="Kas Keluar">

<button onclick="simpan()">SIMPAN</button>

</div>

<table>

<thead>

<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Masuk</th>
<th>Keluar</th>
<th>Saldo</th>
</tr>

</thead>

<tbody id="tabelKas"></tbody>

</table>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxoZrZS4aDmPcxQAfB1d--VSZ_rtmY9iwQoGsu3vM3yqscznh4GXaaN0E2OFaSMO8s/exec";

let admin=false;

document.getElementById("loginBtn").onclick=function(){

let user=prompt("Username Admin");
let pass=prompt("Password");

if(user==="admin" && pass==="12345"){

admin=true;

document.getElementById("formInput").style.display="block";

document.getElementById("loginBtn").style.display="none";

document.getElementById("logoutBtn").style.display="inline";

alert("Login berhasil");

}

else{

alert("Login gagal");

}

}

document.getElementById("logoutBtn").onclick=function(){

admin=false;

document.getElementById("formInput").style.display="none";

document.getElementById("loginBtn").style.display="inline";

document.getElementById("logoutBtn").style.display="none";

}

function loadData(){

fetch(API)

.then(res=>res.json())

.then(data=>{

let html="";

let saldo=0;

data.forEach(d=>{

saldo+=Number(d.masuk)-Number(d.keluar);

html+=`

<tr>

<td>${new Date(d.tanggal).toLocaleDateString("id-ID")}</td>

<td>${d.keterangan}</td>

<td>${d.masuk}</td>

<td>${d.keluar}</td>

<td>${saldo}</td>

</tr>

`;

});

document.getElementById("tabelKas").innerHTML=html;

document.getElementById("saldo").innerHTML="Saldo Kas : Rp "+saldo;

})

}

function simpan(){

let data={

tanggal:document.getElementById("tanggal").value,

keterangan:document.getElementById("ket").value,

masuk:document.getElementById("masuk").value,

keluar:document.getElementById("keluar").value

}

fetch(API,{

method:"POST",

body:JSON.stringify(data)

})

.then(r=>r.text())

.then(()=>{

alert("Data berhasil disimpan");

loadData();

})

}

loadData();

setInterval(loadData,5000);

</script>

</body>

</html>
