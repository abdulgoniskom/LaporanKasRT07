<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Kas RT</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
}

button{
padding:10px 15px;
background:#2f80ed;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

.logout{
background:red;
}

.formInput{
display:none;
margin-top:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border-bottom:1px solid #ddd;
padding:10px;
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h2>Laporan Kas RT & Agustusan</h2>

<select id="pilihKas" onchange="loadData()">

<option value="Kas_RT">Kas RT</option>

<option value="Kas_Agustus">Kas Agustusan</option>

</select>

<h3 id="saldo"></h3>

<div style="text-align:right">

<button id="loginBtn">Login Admin</button>

<button id="logoutBtn" class="logout" style="display:none">Logout</button>

</div>


<div id="formInput" class="formInput">

<h3>Input Transaksi</h3>

<input type="date" id="tanggal">

<input type="text" id="ket" placeholder="Keterangan">

<input type="number" id="masuk" placeholder="Kas Masuk">

<input type="number" id="keluar" placeholder="Kas Keluar">

<button onclick="simpan()">Simpan</button>

</div>


<table>

<thead>

<tr>

<th>Tanggal</th>

<th>Keterangan</th>

<th>Masuk</th>

<th>Keluar</th>

<th>Saldo</th>

</tr>

</thead>

<tbody id="tabelKas"></tbody>

</table>

</div>


<script>

const API="https://script.google.com/macros/s/AKfycby2HGDOInUrZjc4LVwmbbhmm9AdSroYe_Ms3AajMxSYnYe6BMy_3Kw4fnmb9W90jkA/exec";

let admin=false;



document.getElementById("loginBtn").onclick=function(){

let user=prompt("Username");

let pass=prompt("Password");

if(user==="admin" && pass==="12345"){

admin=true;

document.getElementById("formInput").style.display="block";

document.getElementById("loginBtn").style.display="none";

document.getElementById("logoutBtn").style.display="inline";

}

else{

alert("Login gagal");

}

}



document.getElementById("logoutBtn").onclick=function(){

admin=false;

document.getElementById("formInput").style.display="none";

document.getElementById("loginBtn").style.display="inline";

document.getElementById("logoutBtn").style.display="none";

}



function loadData(){

let sheet=document.getElementById("pilihKas").value;

fetch(API+"?sheet="+sheet)

.then(res=>res.json())

.then(data=>{

let html="";

let saldo=0;

data.forEach(d=>{

saldo+=Number(d.masuk)-Number(d.keluar);

let tgl=new Date(d.tanggal);

tgl=isNaN(tgl)?"-":tgl.toLocaleDateString("id-ID");

html+=`

<tr>

<td>${tgl}</td>

<td>${d.keterangan}</td>

<td>${d.masuk}</td>

<td>${d.keluar}</td>

<td>${saldo}</td>

</tr>

`;

});

document.getElementById("tabelKas").innerHTML=html;

document.getElementById("saldo").innerHTML="Saldo : Rp "+saldo;

})

}



function simpan(){

let sheet=document.getElementById("pilihKas").value;

let data={

sheet:sheet,

tanggal:document.getElementById("tanggal").value,

keterangan:document.getElementById("ket").value,

masuk:document.getElementById("masuk").value,

keluar:document.getElementById("keluar").value

}



fetch(API,{

method:"POST",

body:JSON.stringify(data)

})

.then(res=>res.text())

.then(()=>{

alert("Data tersimpan");

loadData();

})

}



loadData();

setInterval(loadData,5000);

</script>

</body>

</html>
