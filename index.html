<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard Kas RT</title>

<meta name="theme-color" content="#2f80ed">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#eef2f7;
}

header{
background:#2f80ed;
color:white;
padding:15px;
text-align:center;
}

.container{
padding:20px;
max-width:1000px;
margin:auto;
}

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

button{
background:#2f80ed;
color:white;
border:none;
padding:8px 12px;
border-radius:5px;
cursor:pointer;
}

.logout{
background:red;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border-bottom:1px solid #ddd;
padding:8px;
text-align:center;
}

input,select{
padding:8px;
margin:5px;
}

.formInput{
display:none;
}

</style>

</head>

<body>

<header>

<h2>Dashboard Kas RT</h2>

</header>

<div class="container">

<div class="card">

<select id="pilihKas" onchange="loadData()">

<option value="Kas_RT">Kas RT</option>

<option value="Kas_Agustus">Kas Agustusan</option>

</select>

<h3 id="saldo">Saldo : Rp 0</h3>

<div style="text-align:right">

<button id="loginBtn">Login Admin</button>

<button id="logoutBtn" class="logout" style="display:none">Logout</button>

<button onclick="cetakPDF()">Export PDF</button>

</div>

</div>


<div class="card formInput" id="formInput">

<h3>Input Transaksi</h3>

<input type="date" id="tanggal">

<input type="text" id="ket" placeholder="Keterangan">

<input type="number" id="masuk" placeholder="Kas Masuk">

<input type="number" id="keluar" placeholder="Kas Keluar">

<button onclick="simpan()">Simpan</button>

</div>


<div class="card">

<input type="text" id="search" placeholder="Cari transaksi..." onkeyup="cariData()">

<table>

<thead>

<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Masuk</th>
<th>Keluar</th>
<th>Saldo</th>
</tr>

</thead>

<tbody id="tabelKas"></tbody>

</table>

</div>


<div class="card">

<h3>Grafik Kas per Bulan</h3>

<canvas id="chartKas"></canvas>

</div>

</div>


<script>

const API="https://script.google.com/macros/s/AKfycbz6HfCsU3ctcsI0okHuMAqCMNkmnY3sfZZAbgu8iY2KIEe-csoZCFA1fePDXcUMVxU/exec";

let admin=false;

let chart;

document.getElementById("loginBtn").onclick=function(){

let user=prompt("Username");

let pass=prompt("Password");

if(user==="admin" && pass==="12345"){

admin=true;

document.getElementById("formInput").style.display="block";

document.getElementById("loginBtn").style.display="none";

document.getElementById("logoutBtn").style.display="inline";

}else{

alert("Login gagal");

}

}


document.getElementById("logoutBtn").onclick=function(){

admin=false;

document.getElementById("formInput").style.display="none";

document.getElementById("loginBtn").style.display="inline";

document.getElementById("logoutBtn").style.display="none";

}



function loadData(){

let sheet=document.getElementById("pilihKas").value;

fetch(API+"?sheet="+sheet)

.then(res=>res.json())

.then(data=>{

let html="";

let saldo=0;

let bulan={};

data.forEach(d=>{

saldo+=Number(d.masuk)-Number(d.keluar);

let tgl=new Date(d.tanggal);

tgl=isNaN(tgl)?"-":tgl.toLocaleDateString("id-ID");

html+=`

<tr>

<td>${tgl}</td>

<td>${d.keterangan}</td>

<td>${d.masuk}</td>

<td>${d.keluar}</td>

<td>${saldo}</td>

</tr>

`;

let m=new Date(d.tanggal).getMonth()+1;

bulan[m]=(bulan[m]||0)+(Number(d.masuk)-Number(d.keluar));

});

document.getElementById("tabelKas").innerHTML=html;

document.getElementById("saldo").innerHTML="Saldo : Rp "+saldo;

grafikBulanan(bulan);

})

}


function grafikBulanan(data){

let labels=Object.keys(data);

let values=Object.values(data);

if(chart) chart.destroy();

chart=new Chart(document.getElementById("chartKas"),{

type:"bar",

data:{

labels:labels,

datasets:[{

label:"Kas per Bulan",

data:values,

borderWidth:1

}]

}

})

}



function cariData(){

let input=document.getElementById("search").value.toLowerCase();

let rows=document.querySelectorAll("#tabelKas tr");

rows.forEach(r=>{

let text=r.innerText.toLowerCase();

r.style.display=text.includes(input)?"":"none";

})

}



function simpan(){

let sheet=document.getElementById("pilihKas").value;

let data={

sheet:sheet,

tanggal:document.getElementById("tanggal").value,

keterangan:document.getElementById("ket").value,

masuk:document.getElementById("masuk").value,

keluar:document.getElementById("keluar").value

}

fetch(API,{

method:"POST",

body:JSON.stringify(data)

})

.then(res=>res.text())

.then(()=>{

alert("Data tersimpan");

loadData();

})

}



function cetakPDF(){

const { jsPDF } = window.jspdf;

let doc=new jsPDF();

doc.text("Laporan Kas RT",20,20);

let rows=document.querySelectorAll("#tabelKas tr");

let y=30;

rows.forEach(r=>{

doc.text(r.innerText,20,y);

y+=10;

});

doc.save("laporan-kas.pdf");

}


loadData();

setInterval(loadData,5000);

</script>

</body>

</html>
