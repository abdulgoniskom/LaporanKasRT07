<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kas RT 07 - Patokan Bulan Laporan</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

<style>
  body{ font-family: 'Segoe UI', Arial, sans-serif; margin:0; background:#f0f2f5; color: #333; }
  header{ background: #2f80ed; color:white; padding:15px; text-align:center; }
  .container{ padding:15px; max-width:1000px; margin:auto; }
  .card{ background:white; padding:15px; border-radius:10px; margin-bottom:15px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
  
  .flex-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .admin-header { display: flex; justify-content: flex-end; margin-bottom: 10px; }
  
  button{ border:none; padding:10px 15px; border-radius:5px; cursor:pointer; font-weight:bold; color:white; }
  .btn-pdf { background: #8e44ad; }
  .btn-login { background: #27ae60; }
  .btn-logout { background: #e74c3c; }
  .btn-save { background: #2f80ed; width: 100%; margin-top: 10px; }

  table{ width:100%; border-collapse:collapse; margin-top: 10px; font-size: 13px; }
  th,td{ border-bottom:1px solid #ddd; padding:10px 5px; text-align:center; }
  th{ background:#f8f9fa; color:#555; }
  .masuk{ color:#27ae60; } .keluar{ color:#e74c3c; }
  
  input, select { padding:10px; border:1px solid #ccc; border-radius:5px; width: 100%; box-sizing: border-box; }
  .formInput { display:none; border-top: 4px solid #27ae60; }
  .label-group { font-size: 12px; font-weight: bold; margin-top: 8px; display: block; }
</style>
</head>
<body>

<header>
  <h3>SISTEM KAS RT 07 BUMI INDAH CITTY</h3>
</header>

<div class="container">
  
  <div class="admin-header">
    <button id="loginBtn" class="btn-login">LOGIN ADMIN</button>
    <button id="logoutBtn" class="btn-logout" style="display:none">LOGOUT</button>
  </div>

  <div class="card">
    <div class="flex-group">
      <div style="flex:1">
        <label class="label-group">PILIH KAS:</label>
        <select id="pilihKas" onchange="loadData()">
          <option value="Kas_RT">Kas Umum RT</option>
          <option value="Kas_Agustusan">Kas Agustusan</option>
        </select>
      </div>
      <div style="flex:1">
        <label class="label-group">LIHAT LAPORAN BULAN:</label>
        <select id="filterBulan" onchange="renderTabel()">
          <option value="">Semua Data</option>
          <option value="1">Januari</option><option value="2">Februari</option><option value="3">Maret</option>
          <option value="4">April</option><option value="5">Mei</option><option value="6">Juni</option>
          <option value="7">Juli</option><option value="8">Agustus</option><option value="9">September</option>
          <option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option>
        </select>
      </div>
      <button class="btn-pdf" onclick="cetakPDF()" style="align-self: flex-end;">📄 PDF</button>
    </div>
    <h2 id="saldoDisplay" style="color:#2f80ed; margin-top:15px;">Saldo Akhir: Rp 0</h2>
  </div>

  <div class="card formInput" id="formInput">
    <h4 id="formTitle">INPUT DATA BARU</h4>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <div>
        <label class="label-group">Tanggal Transaksi:</label>
        <input type="date" id="tanggal">
      </div>
      <div>
        <label class="label-group">Masuk Ke Laporan Bulan:</label>
        <select id="bulanLaporan">
          <option value="1">Januari</option><option value="2">Februari</option><option value="3">Maret</option>
          <option value="4">April</option><option value="5">Mei</option><option value="6">Juni</option>
          <option value="7">Juli</option><option value="8">Agustus</option><option value="9">September</option>
          <option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option>
        </select>
      </div>
    </div>
    <label class="label-group">Keterangan:</label>
    <input type="text" id="ket" placeholder="Contoh: Iuran Kas Warga Januari">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top:10px;">
      <input type="number" id="masuk" placeholder="Uang Masuk (Rp)">
      <input type="number" id="keluar" placeholder="Uang Keluar (Rp)">
    </div>
    <button id="btnSimpan" class="btn-save" onclick="simpan()">SIMPAN KE GOOGLE SHEETS</button>
  </div>

  <div class="card" style="overflow-x:auto;">
    <table>
      <thead>
        <tr id="tableHead">
          <th>Tgl Input</th>
          <th>Keterangan</th>
          <th>Masuk</th>
          <th>Keluar</th>
          <th>Saldo</th>
        </tr>
      </thead>
      <tbody id="tabelKas"></tbody>
    </table>
  </div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxJWvljxTCyb66GXXylVqjsTMwfAobB7NFohZBTuMCloxlD-sWIdglCHTByaMQdZbo/exec"; // GANTI DENGAN URL DEPLOY ANDA
let dataMentah = [];
let adminMode = false;

function rupiah(n) { 
  return n && n != 0 ? "Rp " + Number(n).toLocaleString("id-ID") : "-"; 
}

// 1. LOGIN
document.getElementById("loginBtn").onclick = () => {
  let p = prompt("Masukkan Password Admin:");
  if(p === "12345") {
    adminMode = true;
    document.getElementById("formInput").style.display = "block";
    document.getElementById("loginBtn").style.display = "none";
    document.getElementById("logoutBtn").style.display = "inline";
    renderTabel();
  }
};

document.getElementById("logoutBtn").onclick = () => location.reload();

// 2. LOAD DATA
function loadData() {
  let s = document.getElementById("pilihKas").value;
  fetch(API + "?sheet=" + s)
    .then(r => r.json())
    .then(d => { dataMentah = d; renderTabel(); });
}

// 3. RENDER TABEL (LOGIKA UTAMA)
function renderTabel() {
  let filter = document.getElementById("filterBulan").value;
  let html = ""; let runSaldo = 0;
  
  // Header Aksi jika admin
  document.getElementById("tableHead").innerHTML = `
    <th>Tgl Input</th><th>Keterangan</th><th>Masuk</th><th>Keluar</th><th>Saldo</th>
    ${adminMode ? '<th>Aksi</th>' : ''}`;

  dataMentah.forEach((item, index) => {
    let m = Number(item.masuk) || 0;
    let k = Number(item.keluar) || 0;
    runSaldo += (m - k);

    // Tampilkan hanya jika bulan_laporan cocok dengan filter
    if (filter === "" || item.bulan_laporan == filter) {
      let aksi = adminMode ? `<td>
        <button style="background:#f39c12; padding:5px;" onclick="editData(${index})">Edit</button>
        <button style="background:#e74c3c; padding:5px;" onclick="hapusData(${index})">Del</button>
      </td>` : "";

      html += `<tr>
        <td>${new Date(item.tanggal).toLocaleDateString("id-ID")}</td>
        <td style="text-align:left">${item.keterangan}</td>
        <td class="masuk">${rupiah(m)}</td>
        <td class="keluar">${rupiah(k)}</td>
        <td style="font-weight:bold">${rupiah(runSaldo)}</td>
        ${aksi}
      </tr>`;
    }
  });
  document.getElementById("tabelKas").innerHTML = html;
  document.getElementById("saldoDisplay").innerText = "Saldo Akhir: " + rupiah(runSaldo);
}

// 4. CRUD ACTIONS
function simpan() {
  let fd = new FormData();
  fd.append("action", "add");
  fd.append("sheet", document.getElementById("pilihKas").value);
  fd.append("tanggal", document.getElementById("tanggal").value);
  fd.append("keterangan", document.getElementById("ket").value);
  fd.append("masuk", document.getElementById("masuk").value || 0);
  fd.append("keluar", document.getElementById("keluar").value || 0);
  fd.append("bulan_laporan", document.getElementById("bulanLaporan").value);

  fetch(API, { method: "POST", body: fd }).then(() => { alert("Tersimpan!"); loadData(); });
}

function hapusData(i) {
  if(confirm("Hapus baris ini?")) {
    let fd = new FormData();
    fd.append("action", "delete");
    fd.append("sheet", document.getElementById("pilihKas").value);
    fd.append("row", i);
    fetch(API, { method: "POST", body: fd }).then(() => loadData());
  }
}

function editData(i) {
  let d = dataMentah[i];
  document.getElementById("tanggal").value = new Date(d.tanggal).toISOString().split('T')[0];
  document.getElementById("ket").value = d.keterangan;
  document.getElementById("masuk").value = d.masuk;
  document.getElementById("keluar").value = d.keluar;
  document.getElementById("bulanLaporan").value = d.bulan_laporan;
  
  let b = document.getElementById("btnSimpan");
  b.innerText = "UPDATE DATA"; b.style.background = "#f39c12";
  b.onclick = () => {
    let fd = new FormData();
    fd.append("action", "edit");
    fd.append("row", i);
    fd.append("sheet", document.getElementById("pilihKas").value);
    fd.append("tanggal", document.getElementById("tanggal").value);
    fd.append("keterangan", document.getElementById("ket").value);
    fd.append("masuk", document.getElementById("masuk").value || 0);
    fd.append("keluar", document.getElementById("keluar").value || 0);
    fd.append("bulan_laporan", document.getElementById("bulanLaporan").value);
    fetch(API, { method: "POST", body: fd }).then(() => location.reload());
  };
}

// 5. CETAK PDF
function cetakPDF() {
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();
  let filter = document.getElementById("filterBulan").value;
  let rows = []; let saldoAwal = 0; let running = 0;

  dataMentah.forEach(d => {
    let m = Number(d.masuk) || 0; let k = Number(d.keluar) || 0;
    if (filter !== "" && Number(d.bulan_laporan) < Number(filter)) {
      saldoAwal += (m - k);
    } else if (filter === "" || d.bulan_laporan == filter) {
      if (rows.length === 0) running = saldoAwal + (m - k);
      else running += (m - k);
      rows.push([new Date(d.tanggal).toLocaleDateString("id-ID"), d.keterangan, rupiah(m), rupiah(k), rupiah(running)]);
    }
  });

  rows.unshift(["-", "SALDO PINDAHAN (BULAN LALU)", "-", "-", rupiah(saldoAwal)]);

  doc.text("LAPORAN KAS RT 07 BUMI INDAH CITTY", 105, 15, {align:"center"});
  doc.autoTable({
    startY: 25,
    head: [["Tanggal", "Keterangan", "Masuk", "Keluar", "Saldo"]],
    body: rows,
    theme: 'grid'
  });
  window.open(doc.output('bloburl'), '_blank');
}

loadData();
</script>
</body>
</html>
