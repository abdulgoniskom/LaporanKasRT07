<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kas RT Digital</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
}

header{
background:#2c3e50;
color:white;
padding:15px;
text-align:center;
font-size:20px;
}

.dashboard{
display:flex;
flex-wrap:wrap;
gap:10px;
padding:10px;
}

.card{
flex:1;
background:white;
border-radius:10px;
padding:15px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
text-align:center;
}

.card h3{
margin:5px;
}

.green{
color:green;
}

.red{
color:red;
}

.blue{
color:#3498db;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

th{
background:#34495e;
color:white;
}

.masuk{
color:green;
font-weight:bold;
}

.keluar{
color:red;
font-weight:bold;
}

.search{
padding:10px;
width:95%;
margin:10px;
border-radius:5px;
border:1px solid #ccc;
}

button{
padding:10px 15px;
border:none;
border-radius:5px;
cursor:pointer;
}

.loginbtn{
background:#2ecc71;
color:white;
}

.logoutbtn{
background:#e74c3c;
color:white;
}

.bottommenu{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
border-top:1px solid #ccc;
padding:10px;
}

.menuitem{
text-align:center;
font-size:14px;
}

canvas{
background:white;
margin:10px;
border-radius:10px;
padding:10px;
}

.forminput{
display:none;
background:white;
margin:10px;
padding:10px;
border-radius:10px;
}

input{
padding:8px;
margin:5px;
}

</style>
</head>

<body>

<header>
Kas RT Digital
<button class="loginbtn" onclick="login()">Login Admin</button>
<button class="logoutbtn" onclick="logout()" style="display:none" id="logout">Logout</button>
</header>

<div class="dashboard">

<div class="card">
<h3>Total Saldo</h3>
<h2 id="saldo" class="blue">Rp 0</h2>
</div>

<div class="card">
<h3>Total Pemasukan</h3>
<h2 id="masuk" class="green">Rp 0</h2>
</div>

<div class="card">
<h3>Total Pengeluaran</h3>
<h2 id="keluar" class="red">Rp 0</h2>
</div>

</div>

<canvas id="grafik"></canvas>

<input class="search" id="search" placeholder="Cari transaksi..." onkeyup="searchData()">

<table>

<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Masuk</th>
<th>Keluar</th>
<th>Saldo</th>
<th>Jenis</th>
</tr>
</thead>

<tbody id="tabel"></tbody>

</table>

<div class="forminput" id="forminput">

<h3>Input Transaksi</h3>

<input type="date" id="tgl">
<input type="text" id="ket" placeholder="Keterangan">
<input type="number" id="masukinput" placeholder="Kas Masuk">
<input type="number" id="keluarinput" placeholder="Kas Keluar">

<select id="jenis">
<option>RT</option>
<option>AGUSTUSAN</option>
</select>

<button onclick="simpan()">Simpan</button>

</div>

<div style="text-align:center;margin:10px;">
<button onclick="exportPDF()">Cetak PDF</button>
</div>

<div class="bottommenu">

<div class="menuitem">🏠<br>Dashboard</div>
<div class="menuitem">📊<br>Grafik</div>
<div class="menuitem">📄<br>Laporan</div>

</div>

<script>

const url="https://script.google.com/macros/s/AKfycbw6F3TTzWFggrgZTGIrzCTjjUMW4kZdvZPyGp89aigYcob5Xuv6DUUXq8uwllB5PfA/exec";

let dataKas=[];

function rupiah(x){
return "Rp "+Number(x).toLocaleString("id-ID");
}

async function loadData(){

let res=await fetch(url);
let data=await res.json();

dataKas=data;

render(dataKas);

}

function render(data){

let html="";
let totalMasuk=0;
let totalKeluar=0;
let saldo=0;

data.forEach(d=>{

totalMasuk+=Number(d.Masuk);
totalKeluar+=Number(d.Keluar);
saldo=Number(d.Saldo);

html+=`
<tr>
<td>${d.Tanggal}</td>
<td>${d.Keterangan}</td>
<td class="masuk">${rupiah(d.Masuk)}</td>
<td class="keluar">${rupiah(d.Keluar)}</td>
<td>${rupiah(d.Saldo)}</td>
<td>${d.Jenis}</td>
</tr>
`;

});

document.getElementById("tabel").innerHTML=html;

document.getElementById("saldo").innerHTML=rupiah(saldo);
document.getElementById("masuk").innerHTML=rupiah(totalMasuk);
document.getElementById("keluar").innerHTML=rupiah(totalKeluar);

grafik(data);

}

function grafik(data){

let rtMasuk=0;
let agtMasuk=0;

data.forEach(d=>{

if(d.Jenis=="RT") rtMasuk+=Number(d.Masuk);
if(d.Jenis=="AGUSTUSAN") agtMasuk+=Number(d.Masuk);

});

new Chart(document.getElementById("grafik"),{
type:"bar",
data:{
labels:["Kas RT","Kas Agustusan"],
datasets:[{
label:"Pemasukan",
data:[rtMasuk,agtMasuk]
}]
}
});

}

function searchData(){

let s=document.getElementById("search").value.toLowerCase();

let filter=dataKas.filter(d=>d.Keterangan.toLowerCase().includes(s));

render(filter);

}

function login(){

let user=prompt("Username");
let pass=prompt("Password");

if(user=="admin" && pass=="12345"){

document.getElementById("forminput").style.display="block";
document.getElementById("logout").style.display="inline";

alert("Login berhasil");

}else{

alert("Login gagal");

}

}

function logout(){

location.reload();

}

function exportPDF(){

const {jsPDF}=window.jspdf;

let doc=new jsPDF();

doc.text("Laporan Kas RT",20,20);

let y=30;

dataKas.forEach(d=>{

doc.text(`${d.Tanggal} ${d.Keterangan} ${d.Masuk} ${d.Keluar}`,20,y);

y+=10;

});

doc.save("laporan_kas.pdf");

}

loadData();

</script>

</body>
</html>
