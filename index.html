<!DOCTYPE html>
<html>
<head>
<title>Laporan Kas RT</title>
<style>
table{
border-collapse: collapse;
width:100%;
}
th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}
th{
background:#2c7be5;
color:white;
}
</style>
</head>

<body>

<h2>Laporan Kas RT</h2>

<table id="tabelKas">
<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Masuk</th>
<th>Keluar</th>
<th>Saldo</th>
</tr>
</thead>

<tbody></tbody>

</table>

<script>

fetch("https://script.google.com/macros/s/AKfycby6butKsqn4x445pUa8DBH12c1_tH7xx_Lb8Os7rXAFmjLfrVKtGsqpK9zjDG-Ouf0/exec")
.then(res => res.json())
.then(data => {

let tbody = document.querySelector("#tabelKas tbody");

data.forEach(row => {

let tr = `
<tr>
<td>${row.tanggal}</td>
<td>${row.keterangan}</td>
<td>${row.masuk}</td>
<td>${row.keluar}</td>
<td>${row.saldo}</td>
</tr>
`;

tbody.innerHTML += tr;

});

});

</script>

</body>
</html>
