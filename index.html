```html
<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Kas RT</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#eef2f7;
}

header{
background:#2f80ed;
color:white;
padding:15px;
text-align:center;
}

.container{
padding:20px;
max-width:1100px;
margin:auto;
}

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

/* SCROLL TABEL */

.table-wrapper{
overflow-x:auto;
}

/* TABEL TETAP UTUH */

table{
min-width:900px;
width:100%;
border-collapse:collapse;
}

/* HEADER */

th{
background:#2f80ed;
color:white;
padding:10px;
position:sticky;
top:0;
}

td{
padding:8px;
border-bottom:1px solid #ddd;
white-space:nowrap;
}

.masuk{
color:green;
font-weight:bold;
}

.keluar{
color:red;
font-weight:bold;
}

button{
background:#2f80ed;
color:white;
border:none;
padding:8px 12px;
border-radius:5px;
cursor:pointer;
}

input,select{
padding:8px;
margin:5px;
}

</style>

</head>

<body>

<header>
<h2>Dashboard Kas RT 07</h2>
</header>

<div class="container">

<div class="card">

<select id="pilihKas" onchange="loadData()">
<option value="Kas_RT">Kas RT</option>
<option value="Kas_Agustusan">Kas Agustusan</option>
</select>

<h3 id="saldo">Saldo : Rp 0</h3>

<button onclick="cetakPDF()">Cetak PDF</button>

</div>

<div class="card">

<input type="text" id="search" placeholder="Cari transaksi..." onkeyup="cariData()">

</div>

<div class="card">

<div class="table-wrapper">

<table>

<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Masuk</th>
<th>Keluar</th>
<th>Saldo</th>
</tr>
</thead>

<tbody id="tabelKas"></tbody>

</table>

</div>

</div>

<div class="card">

<h3>Grafik Kas</h3>
<canvas id="chartKas"></canvas>

</div>

</div>

<script>

const API="PASTE_URL_APPS_SCRIPT_DISINI";

let chart;

/* FORMAT RUPIAH */

function rupiah(angka){

angka=Number(angka);

if(!angka || angka===0){
return "-";
}

return "Rp "+angka.toLocaleString("id-ID");

}

/* LOAD DATA */

function loadData(){

let sheet=document.getElementById("pilihKas").value;

fetch(API+"?sheet="+sheet)

.then(res=>res.json())

.then(data=>{

let html="";
let saldo=0;
let totalMasuk=0;
let totalKeluar=0;

data.forEach(d=>{

saldo+=Number(d.masuk)-Number(d.keluar);

let tgl=new Date(d.tanggal).toLocaleDateString("id-ID");

totalMasuk+=Number(d.masuk);
totalKeluar+=Number(d.keluar);

html+=`
<tr>
<td>${tgl}</td>
<td>${d.keterangan}</td>
<td class="masuk">${rupiah(d.masuk)}</td>
<td class="keluar">${rupiah(d.keluar)}</td>
<td>${rupiah(saldo)}</td>
</tr>
`;

});

document.getElementById("tabelKas").innerHTML=html;

document.getElementById("saldo").innerHTML="Saldo : "+rupiah(saldo);

grafik(totalMasuk,totalKeluar);

})

}

/* GRAFIK */

function grafik(masuk,keluar){

if(chart) chart.destroy();

chart=new Chart(document.getElementById("chartKas"),{

type:"pie",

data:{
labels:["Pemasukan","Pengeluaran"],
datasets:[{
data:[masuk,keluar]
}]
}

})

}

/* SEARCH */

function cariData(){

let input=document.getElementById("search").value.toLowerCase();

let rows=document.querySelectorAll("#tabelKas tr");

rows.forEach(r=>{

let text=r.innerText.toLowerCase();

r.style.display=text.includes(input)?"":"none";

})

}

/* CETAK PDF */
  function cetakPDF(){

const { jsPDF } = window.jspdf;
let doc = new jsPDF();

doc.setFontSize(16);
doc.text("LAPORAN KEUANGAN RT 07",105,20,{align:"center"});

doc.setFontSize(12);
doc.text("Perumahan Bumi Indah Citty",105,27,{align:"center"});

doc.line(14,30,196,30);

let rows=[];

document.querySelectorAll("#tabelKas tr").forEach(tr=>{

let td=tr.querySelectorAll("td");

rows.push([
td[0].innerText,
td[1].innerText,
td[2].innerText,
td[3].innerText,
td[4].innerText
]);

});

doc.autoTable({

startY:40,

head:[["Tanggal","Keterangan","Masuk","Keluar","Saldo"]],

body:rows,

theme:"grid",

styles:{fontSize:9},

headStyles:{fillColor:[47,128,237]}

});

let y = doc.lastAutoTable.finalY + 15;

doc.text("Mengetahui,",20,y);

doc.text("Ketua RT 07",20,y+10);
doc.text("(Muhammad Zainudin)",20,y+35);

doc.text("Bendahara RT 07",140,y+10);
doc.text("(Abdul Goni)",140,y+35);

doc.save("Laporan_Kas_RT07.pdf");

}

loadData();

setInterval(loadData,30000);

</script>

</body>
</html>
