<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Kas RT 07 Bumi Indah Citty</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
<style>
body{font-family:Arial;margin:0;background:#eef2f7;}
header{background:#2f80ed;color:white;padding:15px;text-align:center;}
.container{padding:20px;max-width:1000px;margin:auto;}
.card{background:white;padding:15px;border-radius:10px;margin-bottom:20px;box-shadow:0 4px 8px rgba(0,0,0,0.1);}
button{background:#2f80ed;color:white;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;}
.logout{background:red;}
.tableWrapper{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th,td{border-bottom:1px solid #ddd;padding:8px;text-align:center;font-size:13px;}
th{background:#2f80ed;color:white;}
.masuk{color:green;font-weight:bold;}
.keluar{color:red;font-weight:bold;}
input,select{padding:8px;margin:5px;}
.formInput{display:none;}
.imgBukti{max-width:80px;}
</style>
</head>
<body>
<header><h2>Laporan Kas RT 07 Bumi Indah Citty</h2></header>
<div class="container">
<div class="card">
<select id="pilihKas" onchange="loadData()">
<option value="Kas_RT">Kas RT</option>
<option value="Kas_Agustusan">Kas Agustusan</option>
</select>
<select id="filterBulan" onchange="loadData()">
<option value="">Semua Bulan</option>
<option value="1">Januari</option>
<option value="2">Februari</option>
<option value="3">Maret</option>
<option value="4">April</option>
<option value="5">Mei</option>
<option value="6">Juni</option>
<option value="7">Juli</option>
<option value="8">Agustus</option>
<option value="9">September</option>
<option value="10">Oktober</option>
<option value="11">November</option>
<option value="12">Desember</option>
</select>
<h3 id="saldo">Saldo : Rp 0</h3>
<div style="text-align:right">
<button id="loginBtn">Login Admin</button>
<button id="logoutBtn" class="logout" style="display:none">Logout</button>
<button onclick="cetakPDF()">Cetak PDF</button>
</div>
</div>

<div class="card formInput" id="formInput">
<h3>Input Transaksi</h3>
<input type="date" id="tanggal">
<input type="text" id="ket" placeholder="Keterangan">
<input type="number" id="masuk" placeholder="Kas Masuk">
<input type="number" id="keluar" placeholder="Kas Keluar">
<input type="file" id="bukti" accept="image/*">
<button onclick="simpan()">Simpan</button>
</div>

<div class="card">
<input type="text" id="search" placeholder="Cari transaksi..." onkeyup="cariData()">
<div class="tableWrapper">
<table>
<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Masuk</th>
<th>Keluar</th>
<th>Bukti</th>
<th>Saldo</th>
<th id="aksiHeader" style="display:none">Aksi</th>
</tr>
</thead>
<tbody id="tabelKas"></tbody>
</table>
</div>
</div>

<div class="card">
<h3>Grafik Pemasukan vs Pengeluaran</h3>
<canvas id="chartKas"></canvas>
</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbz2r4LnHKMSIYDYJwk9mPZx0RcLf3EJj-w1kkc25uGQh4jqdpaA2xR9wNWvk36JNyE/exec"; // ganti URL Web App
let admin=false, chart;

function rupiah(a){return "Rp "+Number(a).toLocaleString("id-ID");}

document.getElementById("loginBtn").onclick=function(){
let user=prompt("Username"), pass=prompt("Password");
if(user==="admin" && pass==="12345"){
admin=true;
document.getElementById("formInput").style.display="block";
document.getElementById("loginBtn").style.display="none";
document.getElementById("logoutBtn").style.display="inline";
document.getElementById("aksiHeader").style.display="table-cell";
loadData();
}else alert("Login gagal");
}

document.getElementById("logoutBtn").onclick=function(){
admin=false;
document.getElementById("formInput").style.display="none";
document.getElementById("loginBtn").style.display="inline";
document.getElementById("logoutBtn").style.display="none";
document.getElementById("aksiHeader").style.display="none";
loadData();
}

function loadData(){
let sheet=document.getElementById("pilihKas").value;
let bulanFilter=document.getElementById("filterBulan").value;
fetch(API+"?sheet="+sheet).then(r=>r.json()).then(data=>{
let html="", saldo=0, totalMasuk=0, totalKeluar=0;
data.forEach(d=>{
let bulan=new Date(d.tanggal).getMonth()+1;
if(bulanFilter && bulan!=bulanFilter) return;
saldo+=Number(d.masuk)-Number(d.keluar);
totalMasuk+=Number(d.masuk); totalKeluar+=Number(d.keluar);
html+=`<tr>
<td>${new Date(d.tanggal).toLocaleDateString("id-ID")}</td>
<td>${d.keterangan||""}</td>
<td class="masuk">${d.masuk?rupiah(d.masuk):"-"}</td>
<td class="keluar">${d.keluar?rupiah(d.keluar):"-"}</td>
<td>${d.bukti?'<img src="'+d.bukti+'" class="imgBukti">':'-'}</td>
<td>${rupiah(saldo)}</td>
${admin?`<td>
<button onclick="editTrans('${d.rowId}')">✏️</button>
<button onclick="hapusTrans('${d.rowId}')">🗑️</button>
</td>`:''}
</tr>`;
});
document.getElementById("tabelKas").innerHTML=html;
document.getElementById("saldo").innerHTML="Saldo : "+rupiah(saldo);
grafik(totalMasuk,totalKeluar);
})
}

function grafik(masuk,keluar){
if(chart) chart.destroy();
chart=new Chart(document.getElementById("chartKas"),{type:"doughnut",data:{labels:["Pemasukan","Pengeluaran"],datasets:[{data:[masuk,keluar]}]}});
}

function cariData(){
let input=document.getElementById("search").value.toLowerCase();
document.querySelectorAll("#tabelKas tr").forEach(r=>r.style.display=r.innerText.toLowerCase().includes(input)?'':'none');
}

function simpan(){
let sheet=document.getElementById("pilihKas").value;
let t=document.getElementById("tanggal").value;
let k=document.getElementById("ket").value;
let m=document.getElementById("masuk").value||0;
let k1=document.getElementById("keluar").value||0;
let f=document.getElementById("bukti").files[0];

if(f){
let reader=new FileReader();
reader.onload=function(e){
sendData(t,k,m,k1,e.target.result);
}
reader.readAsDataURL(f);
}else sendData(t,k,m,k1,"");
}

function sendData(t,k,m,k1,bukti){
fetch(API,{
method:"POST",
body:JSON.stringify({sheet:document.getElementById("pilihKas").value, action:"add", tanggal:t, keterangan:k, masuk:m, keluar:k1, bukti:bukti})
}).then(()=>{alert("Data tersimpan"); loadData();});
}

function editTrans(id){
let row=document.querySelector(`[onclick*="${id}"]`).parentElement.parentElement;
document.getElementById("tanggal").value=row.cells[0].innerText.split("/").reverse().join("-");
document.getElementById("ket").value=row.cells[1].innerText;
document.getElementById("masuk").value=row.cells[2].innerText.replace(/[^0-9]/g,"")||0;
document.getElementById("keluar").value=row.cells[3].innerText.replace(/[^0-9]/g,"")||0;
document.getElementById("formInput").style.display="block";
document.getElementById("loginBtn").style.display="none";
document.getElementById("logoutBtn").style.display="inline";

document.getElementById("formInput").onsubmit=function(e){e.preventDefault();};
document.getElementById("formInput").querySelector("button").onclick=function(){
let t=document.getElementById("tanggal").value;
let k=document.getElementById("ket").value;
let m=document.getElementById("masuk").value||0;
let k1=document.getElementById("keluar").value||0;
fetch(API,{method:"POST",body:JSON.stringify({sheet:document.getElementById("pilihKas").value, action:"edit", rowId:id, tanggal:t, keterangan:k, masuk:m, keluar:k1, bukti:""})}).then(()=>{alert("Data diperbarui"); loadData();});
};
}

function hapusTrans(id){
if(confirm("Hapus transaksi ini?")){
fetch(API,{method:"POST",body:JSON.stringify({sheet:document.getElementById("pilihKas").value, action:"delete", rowId:id})}).then(()=>loadData());
}

}

function cetakPDF(){
const { jsPDF } = window.jspdf;
let doc = new jsPDF();
let kas = document.getElementById("pilihKas").selectedOptions[0].text;
doc.setFontSize(18); doc.text("LAPORAN KAS RT 07",105,20,{align:"center"});
doc.setFontSize(11); doc.text("Perumahan Bumi Indah Citty",105,27,{align:"center"});
let rows=[];
let totalMasuk=0, totalKeluar=0;
document.querySelectorAll("#tabelKas tr").forEach(tr=>{
let td=tr.querySelectorAll("td");
totalMasuk += Number(td[2].innerText.replace(/[^0-9]/g,""))||0;
totalKeluar += Number(td[3].innerText.replace(/[^0-9]/g,""))||0;
rows.push([td[0].innerText,td[1].innerText,td[2].innerText,td[3].innerText, td[4].innerHTML, td[5].innerText]);
});
doc.autoTable({startY:40, head:[["Tanggal","Keterangan","Masuk","Keluar","Bukti","Saldo"]], body:rows, styles:{fontSize:9}, headStyles:{fillColor:[47,128,237]}, columnStyles:{2:{halign:"right"},3:{halign:"right"},5:{halign:"right"}}});
let y = doc.lastAutoTable.finalY + 10;
doc.text("Total Pemasukan : Rp "+totalMasuk.toLocaleString("id-ID"),14,y);
doc.text("Total Pengeluaran : Rp "+totalKeluar.toLocaleString("id-ID"),14,y+6);
let saldo = totalMasuk-totalKeluar;
doc.text("Saldo Akhir : Rp "+saldo.toLocaleString("id-ID"),14,y+12);
let ttdY = y+30;
doc.text("Tangerang, "+new Date().toLocaleDateString("id-ID"),140,ttdY);
doc.text("Mengetahui,",20,ttdY+10);
doc.text("Ketua RT 07",20,ttdY+20); doc.text("(Muhammad Zainudin)",20,ttdY+40);
doc.text("Bendahara RT 07",140,ttdY+20); doc.text("(Abdul Goni)",140,ttdY+40);
doc.save("Laporan_Kas_RT07.pdf");
}

loadData();
setInterval(loadData,5000);
</script>
</body>
</html>
