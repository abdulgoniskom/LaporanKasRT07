<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Kas RT 07</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
<style>
body{font-family:Arial;margin:0;background:#eef2f7;}
header{background:#2f80ed;color:white;padding:15px;text-align:center;}
.container{padding:10px;max-width:1000px;margin:auto;}
.card{background:white;padding:15px;border-radius:10px;margin-bottom:20px;box-shadow:0 4px 8px rgba(0,0,0,0.1);}
button{background:#2f80ed;color:white;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;}
.logout{background:red;}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
th,td{border-bottom:1px solid #ddd;padding:8px;text-align:center;font-size:13px;word-wrap:break-word;}
th{background:#2f80ed;color:white;}
.masuk{color:green;font-weight:bold;}
.keluar{color:red;font-weight:bold;}
input,select{padding:6px;margin:4px;}
.formInput{display:none;}
.scrollable{overflow-x:auto;}
.bukti-img{max-width:80px;max-height:60px;}
.action-btn{background:#ff9800;margin:0 2px;}
</style>
</head>
<body>

<header><h2>Laporan Kas RT 07 Bumi Indah Citty</h2></header>

<div class="container">

<div class="card">
<select id="pilihKas" onchange="loadData()">
<option value="Kas_RT">Kas RT</option>
<option value="Kas_Agustusan">Kas Agustusan</option>
</select>
<h3 id="saldo">Saldo : Rp 0</h3>
<div style="text-align:right">
<button id="loginBtn">Login Admin</button>
<button id="logoutBtn" class="logout" style="display:none">Logout</button>
<button onclick="cetakPDF()">Cetak PDF</button>
</div>
</div>

<div class="card formInput" id="formInput">
<h3>Tambah / Edit Transaksi</h3>
<input type="date" id="tanggal">
<input type="text" id="ket" placeholder="Keterangan">
<input type="number" id="masuk" placeholder="Kas Masuk">
<input type="number" id="keluar" placeholder="Kas Keluar">
<input type="file" id="bukti" accept="image/*">
<button onclick="simpan()">Simpan</button>
</div>

<div class="card">
<input type="text" id="search" placeholder="Cari transaksi..." onkeyup="cariData()">
<div class="scrollable">
<table>
<thead>
<tr>
<th>Tanggal</th><th>Keterangan</th><th>Masuk</th><th>Keluar</th><th>Bukti</th><th>Saldo</th><th>Action</th>
</tr>
</thead>
<tbody id="tabelKas"></tbody>
</table>
</div>
</div>

<div class="card">
<h3>Grafik Pemasukan vs Pengeluaran</h3>
<canvas id="chartKas"></canvas>
</div>

</div>

<script>
const API="https://script.google.com/macros/s/AKfycbxxUM2QWFrUr0S9C2wh7rmzcYfewAfOm7YwbCDEA7yChm5916ueAB9O5YR1ox_mGA8/exec"; // ganti dengan URL Web App

let admin=false, editRow=null, chart;

function rupiah(a){return "Rp "+Number(a).toLocaleString("id-ID");}

document.getElementById("loginBtn").onclick=function(){
let u=prompt("Username"),p=prompt("Password");
if(u==="admin" && p==="12345"){admin=true;document.getElementById("formInput").style.display="block";this.style.display="none";document.getElementById("logoutBtn").style.display="inline";}else{alert("Login gagal");}
}
document.getElementById("logoutBtn").onclick=function(){admin=false;document.getElementById("formInput").style.display="none";this.style.display="none";document.getElementById("loginBtn").style.display="inline";}

function loadData(){
let sheet=document.getElementById("pilihKas").value;
fetch(API+"?sheet="+sheet)
.then(r=>r.json())
.then(data=>{
let html="", saldo=0, totalMasuk=0, totalKeluar=0;
data.forEach(d=>{
saldo += Number(d.masuk||0)-Number(d.keluar||0);
totalMasuk+=Number(d.masuk||0);
totalKeluar+=Number(d.keluar||0);
let masuk = d.masuk>0?rupiah(d.masuk):"-";
let keluar = d.keluar>0?rupiah(d.keluar):"-";
let bukti = d.bukti ? `<img src="${d.bukti}" class="bukti-img">` : "";
let actions = admin ? `<button class="action-btn" onclick="editData(${d.rowId},'${d.tanggal}','${d.keterangan}',${d.masuk||0},${d.keluar||0},'${d.bukti||""}')">✏️</button>
<button class="action-btn" onclick="hapusData(${d.rowId})">🗑️</button>` : "";
html+=`<tr>
<td>${d.tanggal}</td>
<td>${d.keterangan}</td>
<td class="masuk">${masuk}</td>
<td class="keluar">${keluar}</td>
<td>${bukti}</td>
<td>${rupiah(saldo)}</td>
<td>${actions}</td>
</tr>`;
});
document.getElementById("tabelKas").innerHTML=html;
document.getElementById("saldo").innerHTML="Saldo : "+rupiah(saldo);
grafik(totalMasuk,totalKeluar);
})
}

function grafik(masuk,keluar){
if(chart) chart.destroy();
chart=new Chart(document.getElementById("chartKas"),{type:"doughnut",data:{labels:["Pemasukan","Pengeluaran"],datasets:[{data:[masuk,keluar]}]}});
}

function cariData(){
let val=document.getElementById("search").value.toLowerCase();
document.querySelectorAll("#tabelKas tr").forEach(r=>{
r.style.display = r.innerText.toLowerCase().includes(val)?"":"none";
});
}

function simpan(){
let sheet=document.getElementById("pilihKas").value;
let data={
sheet:sheet,
tanggal:document.getElementById("tanggal").value,
keterangan:document.getElementById("ket").value,
masuk:Number(document.getElementById("masuk").value)||0,
keluar:Number(document.getElementById("keluar").value)||0,
bukti:document.getElementById("bukti").files[0]?URL.createObjectURL(document.getElementById("bukti").files[0]):"",
action: editRow?"edit":"add",
rowId: editRow
};
fetch(API,{method:"POST",body:JSON.stringify(data)})
.then(r=>r.text()).then(()=>{alert("Data tersimpan");editRow=null;document.getElementById("formInput").reset();loadData();});
}

function editData(rowId,tanggal,keterangan,masuk,keluar,bukti){
editRow=rowId;
document.getElementById("tanggal").value=tanggal;
document.getElementById("ket").value=keterangan;
document.getElementById("masuk").value=masuk;
document.getElementById("keluar").value=keluar;
}

function hapusData(rowId){
if(confirm("Hapus transaksi ini?")){
let sheet=document.getElementById("pilihKas").value;
fetch(API,{method:"POST",body:JSON.stringify({sheet:sheet,action:"delete",rowId:rowId})}).then(r=>r.text()).then(()=>{loadData();});
}

loadData();
}
loadData();
setInterval(loadData,5000);
</script>
</body>
</html>
