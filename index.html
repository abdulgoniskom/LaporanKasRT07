<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kas RT</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
}

h2{
text-align:center;
}

button{
padding:10px 15px;
border:none;
background:#2e86de;
color:white;
border-radius:5px;
cursor:pointer;
}

.logout{
background:red;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

.form{
margin-top:20px;
display:none;
}

input{
padding:8px;
margin:5px;
}

</style>

</head>

<body>

<div class="container">

<h2>Laporan Kas RT</h2>

<div id="saldo"></div>

<div style="text-align:right">
<button id="loginBtn">Login Admin</button>
<button id="logoutBtn" class="logout" style="display:none">Logout</button>
</div>

<div id="formInput" class="form">

<h3>Input Transaksi</h3>

<input type="date" id="tanggal">

<input type="text" id="ket" placeholder="Keterangan">

<input type="number" id="masuk" placeholder="Kas Masuk">

<input type="number" id="keluar" placeholder="Kas Keluar">

<button onclick="simpan()">Simpan</button>

</div>

<table>

<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Masuk</th>
<th>Keluar</th>
<th>Saldo</th>
</tr>
</thead>

<tbody id="dataKas"></tbody>

</table>

</div>

<script>

const urlAPI="https://script.google.com/macros/s/AKfycbwkVogSbjgQFccB5XOMZQ4dJtIKdS0zNEpVjIYlsrTw6HaPtNICYWxD5Qtw5Rc0Lo0/exec";

let isAdmin=false;

document.getElementById("loginBtn").onclick=function(){

let user=prompt("Username");
let pass=prompt("Password");

if(user==="admin" && pass==="12345"){

isAdmin=true;

document.getElementById("formInput").style.display="block";

document.getElementById("logoutBtn").style.display="inline";

document.getElementById("loginBtn").style.display="none";

}

else{

alert("Login gagal");

}

}

document.getElementById("logoutBtn").onclick=function(){

isAdmin=false;

document.getElementById("formInput").style.display="none";

document.getElementById("logoutBtn").style.display="none";

document.getElementById("loginBtn").style.display="inline";

}

function loadData(){

fetch(urlAPI+"?sheet=Kas_RT")

.then(r=>r.json())

.then(data=>{

let html="";

let saldo=0;

data.forEach(d=>{

saldo+=Number(d.masuk)-Number(d.keluar);

html+=`

<tr>

<td>${new Date(d.tanggal).toLocaleDateString("id-ID")}</td>

<td>${d.keterangan}</td>

<td>${d.masuk}</td>

<td>${d.keluar}</td>

<td>${saldo}</td>

</tr>

`;

});

document.getElementById("dataKas").innerHTML=html;

document.getElementById("saldo").innerHTML="<h3>Saldo : Rp "+saldo+"</h3>";

})

}

function simpan(){

let data={

tanggal:document.getElementById("tanggal").value,

keterangan:document.getElementById("ket").value,

masuk:document.getElementById("masuk").value,

keluar:document.getElementById("keluar").value

}

fetch(urlAPI,{

method:"POST",

body:JSON.stringify(data)

})

.then(r=>r.text())

.then(res=>{

alert("Data tersimpan");

loadData();

})

}

loadData();

setInterval(loadData,5000);

</script>

</body>

</html>
