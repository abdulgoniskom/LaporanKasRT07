<!DOCTYPE html>
<html>
<head>

<title>Login Kas RT</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:30px;
border-radius:10px;
width:300px;
box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

input{
width:100%;
padding:10px;
margin-bottom:10px;
}

button{
width:100%;
padding:10px;
background:#2c7be5;
color:white;
border:none;
border-radius:5px;
}

</style>

</head>

<body>

<div class="card">

<h2>Login Kas RT</h2>

<input type="text" id="user" placeholder="Username">
<input type="password" id="pass" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<script>

function login(){

let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u=="admin" && p=="12345"){

localStorage.setItem("login","true");
localStorage.setItem("role","admin");

window.location="index.html";

}

else if(u=="warga" && p=="12345"){

localStorage.setItem("login","true");
localStorage.setItem("role","warga");

window.location="index.html";

}

else{

alert("Login salah");

}

}

</script>

</body>
</html>
